<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>创建账户 · 开放研究中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><script src="/auth.js"></script>
  <style>
    :root{--ink:#17202a;--muted:#71808d;--line:#dee5ea;--paper:#f7f9fb;--blue:#246bfd;--red:#b33d49}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:"DM Sans",sans-serif;color:var(--ink)}.bar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,76px)}.brand{display:flex;gap:10px;align-items:center;font:800 19px Manrope,sans-serif;text-decoration:none;color:var(--ink)}.mark{width:28px;height:28px;border-radius:8px;background:#17202a;position:relative}.mark i{position:absolute;top:7px;left:11px;width:5px;height:15px;border-radius:3px;background:#80e9c1;transform:rotate(25deg)}.mark i:nth-child(2){background:#9abaff;transform:translateX(6px) rotate(25deg)}.mark i:nth-child(3){background:#f5c76d;transform:translateX(-6px) rotate(25deg)}.bar p{font-size:13px;color:var(--muted)}.bar a{color:var(--blue);font-weight:800;text-decoration:none}.wrap{width:min(770px,calc(100% - 32px));margin:53px auto 80px}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--blue);font-weight:800}.wrap h1{font:800 clamp(32px,5vw,48px) Manrope,sans-serif;letter-spacing:-.05em;margin:11px 0 10px}.intro{max-width:600px;color:var(--muted);line-height:1.7;margin-bottom:30px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 48px rgba(34,52,70,.08);padding:clamp(22px,5vw,43px)}.section-label{font:800 13px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#586674;margin:0 0 17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 17px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#3e4d5a}.help{font-size:11px;font-weight:500;color:#91a0ab}.field input{height:45px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;outline:none}.field input:focus{border-color:#78a3ff;box-shadow:0 0 0 4px #e9f1ff}.notice{display:none;padding:10px 12px;border-radius:8px;margin:3px 0 17px;font-size:13px;line-height:1.45}.notice.show{display:block}.notice.error{color:#9d3342;background:#fff0f1;border:1px solid #f3c6cb}.notice.success{color:#126d58;background:#ecfbf5;border:1px solid #bdebd9}.actions{border-top:1px solid #edf0f2;margin-top:4px;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.actions small{color:#86939e;line-height:1.55;max-width:380px}.actions button{border:0;border-radius:8px;background:#17202a;color:#fff;padding:12px 19px;font-weight:800;cursor:pointer;white-space:nowrap}.actions button:disabled{opacity:.6;cursor:wait}@media(max-width:650px){.bar p{display:none}.wrap{margin-top:34px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body>
  <header class="bar"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span>开放研究中心</a><p>已有账户？ <a href="/login">登录</a></p></header>
  <main class="wrap"><div class="eyebrow">加入开放研究中心</div><h1>创建你的研究者账户</h1><p class="intro">建立公开的研究者身份，让你的模型、数据、算法与项目拥有清晰、可信的归属。</p><section class="panel"><form id="registerForm" novalidate><p class="section-label">账户信息</p><div class="grid"><div class="field"><label for="username">用户名 <span class="help">字母、数字、-、_</span></label><input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_-]+" autocomplete="username" placeholder="kai-shen"></div><div class="field"><label for="display_name">显示名称</label><input id="display_name" required maxlength="120" autocomplete="name" placeholder="Kai Shen"></div><div class="field full"><label for="email">电子邮箱</label><input id="email" required type="email" autocomplete="email" placeholder="you@research-lab.edu"></div><div class="field"><label for="password">密码 <span class="help">至少 8 个字符</span></label><input id="password" required minlength="8" type="password" autocomplete="new-password" placeholder="设置密码"></div><div class="field"><label for="confirm_password">确认密码</label><input id="confirm_password" required minlength="8" type="password" autocomplete="new-password" placeholder="再次输入密码"></div></div><p class="section-label" style="margin-top:9px">研究者资料 <span class="help">可选</span></p><div class="grid"><div class="field"><label for="organization">所属机构</label><input id="organization" maxlength="255" placeholder="研究实验室 / 大学"></div><div class="field"><label for="interests">研究兴趣 <span class="help">逗号分隔</span></label><input id="interests" placeholder="人工智能、无人机、优化"></div></div><div id="notice" class="notice"></div><div class="actions"><small>注册即表示你会对自己发布的研究资源负责，并遵守平台的开放共享原则。</small><button id="submit" type="submit">创建账户</button></div></form></section></main>
  <script>
    const notice=document.querySelector('#notice');function show(message,kind='error'){notice.className='notice show '+kind;notice.textContent=message}document.querySelector('#registerForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;if(!form.checkValidity()){form.reportValidity();return}const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm_password').value){show('两次输入的密码不一致');return}const btn=document.querySelector('#submit');btn.disabled=true;btn.textContent='正在创建账户…';const payload={username:document.querySelector('#username').value.trim(),display_name:document.querySelector('#display_name').value.trim(),email:document.querySelector('#email').value.trim(),password,confirm_password:document.querySelector('#confirm_password').value,organization:document.querySelector('#organization').value.trim()||null,research_interests:document.querySelector('#interests').value.split(',').map(item=>item.trim()).filter(Boolean)};try{const response=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){const detail=Array.isArray(data.detail)?data.detail.map(item=>item.msg).join('；'):data.detail||'注册失败';throw new Error(detail)}show('账户创建成功，正在前往登录页面…','success');setTimeout(()=>location.href='/login',500)}catch(error){show(error.message);btn.disabled=false;btn.textContent='创建账户'}});OpenResearchAuth.init().then(()=>{if(OpenResearchAuth.isAuthenticated())location.href='/'})
  </script>
</body>
</html>
