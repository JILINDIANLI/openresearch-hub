  <style>
    .code-panel{display:grid;gap:18px}.repo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.repo-title{font:800 21px Manrope,sans-serif;margin:0}.repo-meta{display:flex;flex-wrap:wrap;gap:8px;color:#71808d;font-size:12px;margin-top:7px}.repo-actions{display:flex;gap:8px;flex-wrap:wrap}.repo-actions button,.repo-actions a{border:1px solid var(--line);border-radius:8px;background:#fff;color:#40505d;padding:9px 11px;font-size:12px;font-weight:800}.repo-actions .primary{background:#17202a;color:#fff;border-color:#17202a}.repo-stats{display:flex;gap:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;color:#71808d;font-size:12px}.repo-stats strong{color:var(--ink);margin-left:4px}.repo-columns{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.repo-files,.repo-readme,.repo-activity{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.repo-files h3,.repo-readme h3,.repo-activity h3{font:700 15px Manrope,sans-serif;padding:16px 18px;margin:0;border-bottom:1px solid var(--line)}.tree-row{display:flex;align-items:center;gap:9px;padding:11px 17px;border-bottom:1px solid #edf0f2;font-size:13px}.tree-row:last-child{border-bottom:0}.tree-row a{color:#315fbc;font-weight:700}.tree-row small{color:#94a0aa;margin-left:auto}.readme-body{padding:19px;line-height:1.7;font-size:13px;color:#4b5a66}.readme-body h1,.readme-body h2,.readme-body h3{font-family:Manrope,sans-serif;color:var(--ink);line-height:1.3}.readme-body pre,.code-view pre{background:#111827;color:#e5edf5;border-radius:8px;padding:16px;overflow:auto;font:12px/1.6 "DM Mono",monospace}.readme-body code{background:#f0f3f6;padding:2px 4px;border-radius:4px}.repo-side-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px}.repo-side-card h3{font:700 15px Manrope,sans-serif;margin:0 0 12px}.branch-row,.commit-row{padding:10px 0;border-bottom:1px solid #edf0f2;font-size:12px}.branch-row:last- <body>
  <header class="topbar"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span>开放研究中心</a><div class="top-actions"><a href="/">浏览</a><a class="primary" href="/publish">发布</a><span data-auth-nav></span></div></header>
  <main class="wrap"><div class="crumb"><a href="/">浏览</a><i data-lucide="chevron-right" style="width:14px"></i><span>资源详情</span></div><div id="app" class="loading">正在加载资源…</div></main>
  <dialog id="uploadDialog"><section class="modal"><div class="modal-head"><div><h2>上传文件</h2><p id="uploadHint">为此资源安全保存科研文件。</p></div><button class="close" data-close="uploadDialog"><i data-lucide="x"></i></button></div><div class="modal-body"><label class="drop" id="dropZone"><i data-lucide="cloud-upload"></i><strong>将文件拖放到这里</strong><small>or <span class="select-file">选择文件</span> 从电脑中上传</small><input id="fileInput" type="file" multiple hidden></label><div class="upload-grid"><div class="field"><label for="fileKind">文件类型</label><select id="fileKind"><option value="DOCUMENT">文档</option><option value="MODEL_WEIGHT">模型权重</option><option value="DATASET">数据集</option><option value="PAPER">论文</option><option value="CODE">代码</option><option value="IMAGE">图片</option><option value="VIDEO">视频</option><option value="CONFIG">配置文件</option><option value="RESULT">结果</option><option value="OTHER">其他</option></select></div><div class="field"><label for="fileDescription">说明 <span style="color:#92a0aa;font-weight:500">可选</span></label><input id="fileDescription" maxlength="500" placeholder="简要说明这些文件的用途"></div></div><div id="uploadList" class="upload-list"></div></div><div class="modal-actions"><button id="cancelUpload" type="button">取消</button><button id="startUpload" class="start" type="button" disabled>上传文件</button></div></section></dialog>
  <dialog id="previewDialog"><section class="modal preview-modal"><div class="modal-head"><div><h2 id="previewTitle">预览</h2><p>安全的临时预览链接</p></div><button class="close" data-close="previewDialog"><i data-lucide="x"></i></button></div><div id="previewContent" class="preview-content"></div></section></dialog>
  <script>
    const app=document.querySelector('#app'),resourceId=location.pathname.split('/').filter(Boolean).pop(),labels={model:'模型',dataset:'数据集',algorithm:'算法',project:'项目',paper:'论文',demo:'演示',tutorial:'教程'},icons={model:'box',dataset:'database',algorithm:'braces',project:'folder-git-2',paper:'file-text',demo:'play',tutorial:'book-open'},fileIcons={MODEL_WEIGHT:'cpu',DATASET:'database',PAPER:'file-text',CODE:'code-2',IMAGE:'image',VIDEO:'video',DOCUMENT:'file',CONFIG:'settings-2',RESULT:'chart-no-axes-combined',OTHER:'file'},recommendations={model:'.pt · .pth · .onnx · .safetensors · README.md',dataset:'.zip · .csv · .json · .parquet',paper:'.pdf',demo:'.mp4 · .webm'};let resource,files=[],activities=[],activeTab='overview',queued=[],activeXhr=null;
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fileKindLabels={MODEL_WEIGHT:'模型权重',DATASET:'数据集',PAPER:'论文',CODE:'代码',IMAGE:'图片',VIDEO:'视频',DOCUMENT:'文档',CONFIG:'配置文件',RESULT:'结果',OTHER:'其他'};const detailLabels={framework:'框架',task:'任务',parameters:'参数量',size:'大小',format:'格式',category:'类别',difficulty:'难度',year:'年份',authors:'作者',journal:'期刊',members:'成员',duration:'时长',repository_url:'代码仓库链接',homepage_url:'主页链接',paper_url:'论文链接',code_url:'代码链接',model_url:'模型链接',video_url:'视频链接',project_url:'项目链接',license:'许可证',doi:'DOI'};const detailLabel=key=>detailLabels[String(key||'').toLowerCase()]||String(key||'').replaceAll('_',' ');const fmtSize=n=>{if(n<1024)return n+' B';const units=['KB','MB','GB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<2);return n.toFixed(n>=10||i===0?0:1)+' '+units[i]};const initials=user=>(user?.display_name||user?.username||'OR').split(/[\s_-]+/).filter(Boolean).map(v=>v[0]).join('').slice(0,2).toUpperCase();const link=v=>v&&/^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noreferrer">${esc(v)}</a>`:esc(v||'—');
    function extensionDetails(details){const rows=[];for(const[k,v]of Object.entries(details||{})){if(v===null||v===undefined||v==='')continue;const show=Array.isArray(v)?v.join(', '):v;rows.push(`<div class="detail-item"><label>${esc(detailLabel(k))}</label><div>${String(show).startsWith('http')?link(show):esc(show)}</div></div>`)}return rows.join('')||'<div class="detail-item"><div>暂无扩展信息</div></div>'}

    const statusLabel = value => ({'':'全部',OPEN:'开放',IN_PROGRESS:'处理中',RESOLVED:'已解决',CLOSED:'已关闭',LOCKED:'已锁定'})[value] || value;
    const statusButtons = statusValues.map(value => `<button type="button" class="community-status ${state.status === value ? 'active' : ''}" data-v9-status="${esc(value)}">${esc(statusLabel(value))}</button>`).join('');
    const issueFilters = kind === 'issues' ? `<label>问题类型<select data-v9-filter="issue_type">${options(['','BUG','DOCUMENTATION','DATASET','MODEL','REPRODUCTION','FEATURE_REQUEST','QUESTION','OTHER'], state.issue_type, {'':'全部类型',BUG:'缺陷',DOCUMENTATION:'文档',DATASET:'数据集',MODEL:'模型',REPRODUCTION:'复现',FEATURE_REQUEST:'功能请求',QUESTION:'提问',OTHER:'其他'})}</select></label><label>Priority<select data-v9-filter="priority">${options(['','LOW','MEDIUM','HIGH','CRITICAL'], state.priority, {'':'全部优先级',LOW:'低',MEDIUM:'中',HIGH:'高',CRITICAL:'紧急'})}</select></label>` : '';
    return `<div class="community-filterbar"><div class="community-statuses">${statusButtons}</div>${issueFilters}<label>排序<select data-v9-filter="sort">${options(sortValues, state.sort, sortLabels)}</select></label></div>`;
  }

  async function render(kind, next = {}) {
    installStyle();
    active = {kind, status:'', issue_type:'', priority:'', sort:'newest', page:1, page_size:10, ...active, ...next};
    if (active.kind !== kind) active = {kind, status:'', issue_type:'', priority:'', sort:'newest', page:1, page_size:10};
    const content = root.querySelector('.tab-content');
    if (!content) return;
    content.innerHTML = '<div class="loading">正在加载社区内容…</div>';
    const params = new URLSearchParams({sort:active.sort, page:String(active.page), page_size:String(active.page_size)});
    if (active.status) params.set('status', active.status);
    if (kind === 'issues' && active.issue_type) params.set('issue_type', active.issue_type);
    if (kind === 'issues' && active.priority) params.set('priority', active.priority);
    const response = await OpenResearchAuth.request(`/api/resources/${resourceId}/${kind}?${params}`);
    if (!response.ok) {
      const detail = (await response.json().catch(() => ({}))).detail || '无法加载社区内容。';
      content.innerHTML = `<div class="error">${esc(detail)}</div>`;
      return;
    }
    const data = await response.json();
    const isIssue = kind === 'issues';
    const items = data.items || [];
    const pinned = isIssue ? [] : items.filter(item => item.is_pinned);
    const unpinned = isIssue ? items : items.filter(item => !item.is_pinned);
    const pageCount = Math.max(1, Math.ceil((data.total || 0) / active.page_size));
    const list = rows => rows.length ? `<div class="community-list">${rows.map(item => row(item, kind)).join('')}</div>` : '<div class="community-empty">未找到符合条件的内容。</div>';
    content.innerHTML = `<section class="card"><div class="community-toolbar"><div><h2>${isIssue ? '问题' : '讨论'}</h2><p>共 ${data.total || 0} ${isIssue ? '个问题' : '个讨论主题'}</p></div>${OpenResearchAuth.isAuthenticated() ? `<button class="new-community" data-v9-new>新建${isIssue ? '问题' : '讨论'}</button>` : ''}</div><div id="v9-create-host"></div>${filterMarkup(kind, active)}${pinned.length ? `<div class="community-section-label">置顶 discussions</div>${list(pinned)}` : ''}<div class="community-section-label">${isIssue ? '全部问题' : '全部讨论'}</div>${list(unpinned)}${data.total ? `<div class="community-pagination"><span>第 ${data.page} / ${pageCount} 页</span><button type="button" aria-label="上一页" data-v9-page="${data.page - 1}" ${data.page <= 1 ? 'disabled' : ''}>‹</button><button type="button" aria-label="下一页" data-v9-page="${data.page + 1}" ${data.page >= pageCount ? 'disabled' : ''}>›</button></div>` : ''}</section>`;
    content.querySelectorAll('[data-v9-status]').forEach(button => button.addEventListener('click', () => render(kind, {status:button.dataset.v9Status, page:1})));
    content.querySelectorAll('[data-v9-filter]').forEach(select => select.addEventListener('change', () => render(kind, {[select.dataset.v9Filter]:select.value, page:1})));
    content.querySelectorAll('[data-v9-page]').forEach(button => button.addEventListener('click', () => render(kind, {page:Number(button.dataset.v9Page)})));
    content.querySelector('[data-v9-new]')?.addEventListener('click', () => showCreate(kind, content.querySelector('#v9-create-host')));
  }

  function showCreate(kind, host) {
    const isIssue = kind === 'issues';
    host.innerHTML = `<form class="community-form community-form-card" id="v9-create"><div class="community-form-grid"><label>标题<input name="title" required minlength="5" maxlength="200" placeholder="请输入清晰、具体的标题"></label>${isIssue ? `<label>问题类型<select name="issue_type">${options(['BUG','DOCUMENTATION','DATASET','MODEL','REPRODUCTION','FEATURE_REQUEST','QUESTION','OTHER'], 'OTHER', {'':'全部类型',BUG:'缺陷',DOCUMENTATION:'文档',DATASET:'数据集',MODEL:'模型',REPRODUCTION:'复现',FEATURE_REQUEST:'功能请求',QUESTION:'提问',OTHER:'其他'})}</select></label>` : ''}<label class="wide">${isIssue ? '描述' : '讨论内容'}<textarea name="content" required minlength="1" maxlength="20000" placeholder="可使用 Markdown 补充背景、步骤或链接。"></textarea></label></div><span class="community-form-error" id="v9-create-error"></span><div class="community-form-actions"><button type="button" class="community-cancel" data-v9-cancel>取消</button><button class="new-community" type="submit">创建${isIssue ? '问题' : '讨论'}</button></div></form>`;
    host.querySelector('[data-v9-cancel]').addEventListener('click', () => { host.innerHTML = ''; });
    host.querySelector('#v9-create').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = {title:form.elements.title.value, ...(isIssue ? {description:form.elements.content.value, issue_type:form.elements.issue_type.value} : {content:form.elements.content.value})};
      const button = form.querySelector('[type="submit"]');
      button.disabled = true;
      const response = await OpenResearchAuth.request(`/api/resources/${resourceId}/${kind}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      if (!response.ok) {
        form.querySelector('#v9-create-error').textContent = (await response.json().catch(() => ({}))).detail || '无法创建此内容。';
        button.disabled = false;
        return;
      }
      const created = await response.json();
      location.href = `/${isIssue ? 'issues' : 'discussions'}/${created.id}`;
    });
  }

  function bindTabs() {
    root?.querySelectorAll('button[data-v9]').forEach(button => {
      if (button.dataset.v9Enhanced) return;
      button.dataset.v9Enhanced = 'true';
      const kind = button.dataset.v9;
      button.onclick = async () => {
        root.querySelectorAll('.tabs button').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        await render(kind, {kind});
      };
    });
  }
  new MutationObserver(bindTabs).observe(root, {childList:true, subtree:true});
  setTimeout(bindTabs, 900);
})();
</script>
<script>
/* V10 adds a 科研展示 entry without rewriting the V1-V9 resource shell. */
(() => {
  const root = document.querySelector('#app');
  const resourceId = location.pathname.split('/').filter(Boolean)[1];
  let bound = false;
  function installStyle() {
    if (document.querySelector('#v10-showcase-tab-style')) return;
    const style = document.createElement('style');
    style.id = 'v10-showcase-tab-style';
    style.textContent = '.v10-showcase-note{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 20px;border:1px solid #dce7e5;border-radius:10px;background:#f7fcfa;color:#3d5a53}.v10-showcase-note h2{margin:0 0 5px;font-size:18px}.v10-showcase-note p{margin:0;color:#6b7f79;font-size:12px}.v10-showcase-note .v10-actions{display:flex;gap:8px;flex-wrap:wrap}.v10-showcase-note a,.v10-showcase-note button{border:1px solid #cbdad6;border-radius:7px;background:#fff;color:#216b5a;padding:9px 11px;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer}.v10-showcase-note .primary{border-color:#176b58;background:#176b58;color:#fff}@media(max-width:620px){.v10-showcase-note{align-items:flex-start;flex-direction:column}}';
    document.head.appendChild(style);
  }
  async function meta() { const response = await OpenResearchAuth.request(`/api/resources/${resourceId}`); return response.ok ? response.json() : null; }
  function addTab() {
    const tabs = root?.querySelector('.tabs');
    if (!tabs || tabs.querySelector('[data-v10-showcase-tab]')) return;
    const button = document.createElement('button');
    button.type = 'button'; button.dataset.v10ShowcaseTab = '1'; button.textContent = '科研展示';
    button.addEventListener('click', async () => { tabs.querySelectorAll('button').forEach(item => item.classList.remove('active')); button.classList.add('active'); await renderPane(); });
    const discussions = tabs.querySelector('[data-v9="discussions"]');
    tabs.insertBefore(button, discussions || tabs.querySelector('[data-tab="activity"]') || null);
  }
  async function renderPane() {
    installStyle();
    const content = root.querySelector('.tab-content');
    content.innerHTML = '<div class="loading">正在加载科研展示…</div>';
    const [resource, response] = await Promise.all([meta(), OpenResearchAuth.request(`/api/resources/${resourceId}/showcase`)]);
    const owner = resource?.author_id === OpenResearchAuth.currentUser?.id;
    if (!response.ok) {
      content.innerHTML = `<section class="v10-showcase-note"><div><h2>暂无科研展示</h2><p>此资源尚未创建科研展示页面。</p></div><div class="v10-actions">${owner ? `<a class="primary" href="/resources/${resourceId}/showcase?edit=1">创建科研展示</a>` : ''}</div></section>`;
      return;
    }
    const showcase = await response.json();
    content.innerHTML = `<section class="v10-showcase-note"><div><h2>${String(showcase.title || '科研展示').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}</h2><p>${String(showcase.short_description || '研究背景、方法、结果与媒体资料。').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}</p></div><div class="v10-actions"><a class="primary" href="/resources/${resourceId}/showcase">打开科研展示</a>${owner ? `<a href="/resources/${resourceId}/showcase?edit=1">编辑</a>` : ''}</div></section>`;
  }
  function bind() {
    if (!root || bound) return;
    if (!root.querySelector('.tabs')) return;
    bound = true; addTab();
  }
  new MutationObserver(bind).observe(root, {childList:true, subtree:true});
  setTimeout(bind, 800);
})();
</script>

  </style>
  <script>
    (()=>{
      const id=location.pathname.split('/').filter(Boolean).pop(),app135=document.querySelector('#app');
      const esc135=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const num135=value=>Number(value||0).toLocaleString();
      const icon135=name=>`<i data-lucide="${name}"></i>`;
      function inject135(data,related){
        if(!app135||app135.querySelector('.v135-info'))return;
        const info=document.createElement('div');info.className='v135-info';info.innerHTML=[['资源类型',({model:'模型',dataset:'数据集',algorithm:'算法',project:'项目',paper:'论文',demo:'演示',tutorial:'教程'})[String(data.resource_type||'').toLowerCase()]||String(data.resource_type||'').toUpperCase()],['研究领域',data.research_field||'—'],['版本',data.latest_version?`v${data.latest_version}`:'—'],['许可证',data.license||'—']].map(item=>`<section class="card"><small>${item[0]}</small><strong>${esc135(item[1])}</strong></section>`).join('');app135.prepend(info);
        const host=app135.querySelector('.tab-content');if(!host||!related.length)return;
        const section=document.createElement('section');section.className='card v135-related';section.innerHTML=`<h2>相关资源</h2><p style="color:var(--muted);font-size:12px;margin:6px 0 0">根据研究方向、标签与资源类型推荐的公开内容。</p><div class="v135-related-grid">${related.map(item=>`<a class="v135-related-card" href="/resources/${item.id}"><small>${esc135(({model:'模型',dataset:'数据集',algorithm:'算法',project:'项目',paper:'论文',demo:'演示',tutorial:'教程'})[String(item.resource_type||'').toLowerCase()]||'资源')}</small><strong>${esc135(item.title)}</strong><p>${esc135(item.research_field||item.description||'开放研究中心资源')}</p><div class="v135-related-meta"><span>${icon135('star')}${num135(item.stars_count??item.stars)}</span><span>${icon135('eye')}${num135(item.views_count??item.views)}</span><span>${icon135('download')}${num135(item.downloads_count??item.downloads)}</span></div></a>`).join('')}</div>`;host.appendChild(section);window.lucide?.createIcons();
      }
      async function load135(){try{const [resourceResponse,relatedResponse]=await Promise.all([fetch(`/api/resources/${encodeURIComponent(id)}`),fetch(`/api/resources/${encodeURIComponent(id)}/related?limit=6`)]);if(!resourceResponse.ok)return;const data=await resourceResponse.json();const related=relatedResponse.ok?await relatedResponse.json():[];const observer=new MutationObserver(()=>inject135(data,related));observer.observe(app135,{childList:true,subtree:true});inject135(data,related);setTimeout(()=>observer.disconnect(),10000)}catch(_){}}
      load135();
    })();
  </script>
