<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/auth.js"></script>
  <script src="/community-ui.js"></script>
  <title>讨论详情 · 开放研究中心</title>
  <style>
    :root{--ink:#17212b;--muted:#71808d;--line:#e3e9ee;--soft:#f6f8fa;--blue:#2563eb;--danger:#b42318;--green:#087443}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,5vw)}.brand{font-weight:850;letter-spacing:-.02em;color:var(--ink)}
    .wrap{max-width:1040px;margin:34px auto;padding:0 20px}.back{display:inline-flex;gap:7px;align-items:center;color:#61707d;font-size:13px;margin-bottom:16px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:18px;box-shadow:0 5px 18px rgba(28,44,58,.035)}
    h1{font-size:30px;line-height:1.2;letter-spacing:-.025em;margin:12px 0 10px}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 8px}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#657482}.meta{color:var(--muted);font-size:12px;line-height:1.6}.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;background:#eaf1ff;color:#2455b8}.badge.open{background:#e8f7ef;color:var(--green)}.badge.closed{background:#f0f2f4;color:#5b6874}.badge.locked{background:#fff1ed;color:#a13d27}.badge.pinned{background:#fff8db;color:#8a6200}.markdown{line-height:1.8;color:#334250;margin-top:20px;overflow-wrap:anywhere}.markdown p{margin:0 0 10px}.markdown h1,.markdown h2,.markdown h3{margin:18px 0 8px}.markdown pre{background:#101821;color:#e5edf5;padding:14px;border-radius:8px;overflow:auto}.markdown code{background:#eef2f5;border-radius:4px;padding:2px 5px;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.markdown pre code{background:transparent;padding:0}.markdown a{word-break:break-word}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.btn{border:1px solid #cdd7df;border-radius:7px;padding:9px 12px;background:#fff;color:#2c3a46;font-weight:750;cursor:pointer}.btn:hover{border-color:#9eb2c0;background:#f7fafc}.btn.primary{background:#17212b;color:#fff;border-color:#17212b}.btn.warn{color:#a13d27}.btn:disabled{opacity:.55;cursor:wait}.side-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f3;padding:11px 0;font-size:13px}.side-row:last-child{border:0}.side-row span{color:var(--muted)}.side-row strong{text-align:right;overflow-wrap:anywhere}.editor{display:grid;gap:10px;margin-top:15px;padding-top:18px;border-top:1px solid #edf1f3}.editor input,.editor textarea,.comment-form textarea{width:100%;border:1px solid #ccd6de;border-radius:7px;padding:10px;font:inherit;resize:vertical}.editor textarea{min-height:150px}.editor label{font-size:12px;font-weight:800;color:#52616d}.editor .editor-actions{display:flex;gap:8px}.comment{border-top:1px solid #edf1f3;padding:18px 0 4px}.comment:first-of-type{border-top:0;padding-top:0}.comment-body{margin-top:9px}.comment-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.comment-meta strong{font-size:13px}.comment-meta time{font-size:11px;color:var(--muted)}.comment-actions{display:flex;gap:6px;margin-top:10px}.comment-actions button{border:0;background:transparent;color:#557080;padding:4px 0;margin-right:12px;font-size:12px;cursor:pointer}.comment-actions button:hover{color:var(--blue)}.comment-replies{margin-left:28px;border-left:2px solid #eef2f5;padding-left:17px}.deleted{color:#8b98a3;font-style:italic}.comment-form{border-top:1px solid #edf1f3;margin-top:18px;padding-top:18px}.comment-form textarea{min-height:105px}.comment-form .form-row{display:flex;gap:8px;align-items:center;margin-top:8px}.hint{color:var(--muted);font-size:12px}.empty{padding:24px 0;color:var(--muted)}.error{color:var(--danger);font-size:13px;margin-top:10px}.loading{color:var(--muted);padding:42px 0;text-align:center}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{margin-top:22px;padding:0 14px}.card{padding:18px}h1{font-size:25px}.top{padding:0 14px}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">开放研究中心</a><span data-auth-nav></span></header>
  <main class="wrap" id="app"><div class="loading">正在加载讨论...</div></main>
  <script>
  (() => {
    const id = Number(location.pathname.split('/').filter(Boolean).pop());
    const app = document.querySelector('#app');
    const esc = OpenResearchCommunity.escapeHtml;
    let discussion = null;
    const currentId = () => OpenResearchAuth.currentUser?.id;
    const formatTime = value => value ? new Date(value).toLocaleString('zh-CN') : '—';
    const authorName = author => esc(author?.display_name || author?.username || '已删除用户');
    const errorText = async response => (await response.json().catch(() => ({}))).detail || '操作失败，请稍后重试';
    const statusLabel = value => ({OPEN:'开放',CLOSED:'已关闭',LOCKED:'已锁定',PINNED:'置顶'})[String(value||'').toUpperCase()] || value;
    function statusBadge(value, kind='') { return `<span class="badge ${kind || String(value).toLowerCase()}">${esc(statusLabel(value))}</span>`; }

    function commentMarkup(comment, canReply) {
      const mine = currentId() === comment.author?.id;
      const deleted = comment.is_deleted;
      const body = deleted ? '<div class="deleted">[已删除]</div>' : `<div class="markdown">${OpenResearchCommunity.renderMarkdown(comment.content)}</div>`;
      const controls = !deleted ? `<div class="comment-actions">${canReply ? `<button type="button" data-reply="${comment.id}">回复</button>` : ''}${mine ? `<button type="button" data-edit-comment="${comment.id}">编辑</button><button type="button" data-delete-comment="${comment.id}">删除</button>` : ''}</div>` : '';
      const replies = comment.replies?.length ? `<div class="comment-replies">${comment.replies.map(item => commentMarkup(item, false)).join('')}</div>` : '';
      return `<article class="comment" data-comment="${comment.id}"><div class="comment-meta"><strong>${authorName(comment.author)}</strong><time>${formatTime(comment.created_at)}</time>${comment.updated_at !== comment.created_at ? '<span class="hint">已编辑</span>' : ''}</div><div class="comment-body">${body}</div>${controls}<div class="inline-editor" data-comment-editor="${comment.id}"></div>${replies}</article>`;
    }

    function render() {
      const owner = discussion.resource?.author_id === currentId();
      const author = discussion.author?.id === currentId();
      const canComment = OpenResearchAuth.isAuthenticated() && discussion.status === 'OPEN' && !discussion.is_locked;
      const comments = discussion.comments?.length ? discussion.comments.map(item => commentMarkup(item, canComment)).join('') : '<div class="empty">还没有评论，欢迎成为第一个回复的人。</div>';
      app.innerHTML = `<a class="back" href="/resources/${discussion.resource.id}">← 返回 ${esc(discussion.resource.title)}</a><div class="grid"><div><section class="card"><div class="badges">${statusBadge(discussion.status)}${discussion.is_pinned ? statusBadge('PINNED','pinned') : ''}${discussion.is_locked ? statusBadge('LOCKED','locked') : ''}</div><h1>${esc(discussion.title)}</h1><div class="meta">由 <a href="/users/${encodeURIComponent(discussion.author.username)}">${authorName(discussion.author)}</a> 发布 · ${formatTime(discussion.created_at)} · 更新于 ${formatTime(discussion.updated_at)}</div><div class="markdown">${OpenResearchCommunity.renderMarkdown(discussion.content)}</div><div class="actions" data-actions></div><div class="inline-editor" id="discussion-editor"></div></section><section class="card"><h2>回复 <span class="hint">${discussion.comments_count}</span></h2><div id="comments">${comments}</div>${canComment ? `<form class="comment-form" id="comment-form"><textarea name="content" required maxlength="10000" placeholder="用 Markdown 写下你的回复..."></textarea><div class="form-row"><button class="btn primary" type="submit">发表评论</button><span class="hint">支持一级评论和回复</span></div><div class="error" id="comment-error"></div></form>` : OpenResearchAuth.isAuthenticated() && (discussion.status !== 'OPEN' || discussion.is_locked) ? '<div class="empty">此讨论已锁定或关闭，暂时不能继续评论。</div>' : '<div class="empty">登录后可以参与讨论。</div>'}</section></div><aside><section class="card"><h3>讨论信息</h3><div class="side-row"><span>状态</span><strong>${esc(statusLabel(discussion.status))}</strong></div><div class="side-row"><span>评论</span><strong>${discussion.comments_count}</strong></div><div class="side-row"><span>资源</span><strong><a href="/resources/${discussion.resource.id}">${esc(discussion.resource.title)}</a></strong></div><div class="side-row"><span>作者</span><strong>${authorName(discussion.author)}</strong></div></section></aside></div>`;
      const actions = app.querySelector('[data-actions]');
      if (author || owner) actions.insertAdjacentHTML('beforeend', `<button class="btn" type="button" data-edit-discussion>编辑讨论</button>`);
      if (author || owner) actions.insertAdjacentHTML('beforeend', `<button class="btn" type="button" data-status-action="${discussion.status === 'OPEN' ? 'close' : 'reopen'}">${discussion.status === 'OPEN' ? '关闭讨论' : '重新开放讨论'}</button>`);
      if (owner) { actions.insertAdjacentHTML('beforeend', `<button class="btn" type="button" data-lock-action="${discussion.is_locked ? 'unlock' : 'lock'}">${discussion.is_locked ? '解锁' : '锁定'}评论</button>`); actions.insertAdjacentHTML('beforeend', `<button class="btn" type="button" data-pin-action="${discussion.is_pinned ? 'unpin' : 'pin'}">${discussion.is_pinned ? '取消置顶' : '置顶'}讨论</button>`); }
      app.querySelector('[data-edit-discussion]')?.addEventListener('click', showDiscussionEditor);
      app.querySelector('[data-status-action]')?.addEventListener('click', event => action(event.currentTarget.dataset.statusAction, `/api/discussions/${id}/${event.currentTarget.dataset.statusAction}`));
      app.querySelector('[data-lock-action]')?.addEventListener('click', event => action(event.currentTarget.dataset.lockAction, `/api/discussions/${id}/${event.currentTarget.dataset.lockAction}`));
      app.querySelector('[data-pin-action]')?.addEventListener('click', event => action(event.currentTarget.dataset.pinAction, `/api/discussions/${id}/pin`, event.currentTarget.dataset.pinAction === 'unpin' ? 'DELETE' : 'POST'));
      app.querySelector('#comment-form')?.addEventListener('submit', submitComment);
      app.querySelectorAll('[data-reply]').forEach(button => button.addEventListener('click', () => showCommentEditor(button.dataset.reply, true)));
      app.querySelectorAll('[data-edit-comment]').forEach(button => button.addEventListener('click', () => showCommentEditor(button.dataset.editComment, false)));
      app.querySelectorAll('[data-delete-comment]').forEach(button => button.addEventListener('click', () => deleteComment(button.dataset.deleteComment)));
      window.lucide?.createIcons();
    }
    function showDiscussionEditor() {
      const host = app.querySelector('#discussion-editor');
      host.innerHTML = `<form class="editor" id="discussion-edit-form"><label>标题<input name="title" required minlength="5" maxlength="200" value="${esc(discussion.title)}"></label><label>正文<textarea name="content" required maxlength="20000">${esc(discussion.content)}</textarea></label><div class="editor-actions"><button class="btn primary" type="submit">保存修改</button><button class="btn" type="button" data-cancel>取消</button></div><div class="error" id="discussion-edit-error"></div></form>`;
      host.querySelector('[data-cancel]').onclick = () => host.innerHTML = '';
      host.querySelector('form').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.currentTarget); const button = event.currentTarget.querySelector('button'); OpenResearchCommunity.setBusy(button, true); try { discussion = await OpenResearchCommunity.jsonRequest(`/api/discussions/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:form.get('title'), content:form.get('content')}) }); render(); } catch (error) { host.querySelector('#discussion-edit-error').textContent = error.message; } finally { OpenResearchCommunity.setBusy(button, false); } };
    }
    function findComment(list, commentId) { for (const item of list || []) { if (String(item.id) === String(commentId)) return item; const nested = findComment(item.replies, commentId); if (nested) return nested; } return null; }
    function showCommentEditor(commentId, reply) {
      const host = app.querySelector(`[data-comment-editor="${commentId}"]`); if (!host) return; const source = findComment(discussion.comments, commentId); const value = reply ? '' : source?.content || ''; host.innerHTML = `<form class="editor"><label>${reply ? '回复此评论' : '编辑评论'}<textarea name="content" required maxlength="10000">${esc(value)}</textarea></label><div class="editor-actions"><button class="btn primary" type="submit">${reply ? '回复' : '保存'}</button><button class="btn" type="button" data-cancel>取消</button></div><div class="error"></div></form>`; host.querySelector('[data-cancel]').onclick = () => host.innerHTML = ''; host.querySelector('form').onsubmit = async event => { event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button'); OpenResearchCommunity.setBusy(button,true); try { const content = form.elements.content.value; const url = reply ? `/api/discussions/${id}/comments` : `/api/comments/${commentId}`; const options = {method: reply ? 'POST' : 'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(reply ? {content, parent_id:Number(commentId)} : {content})}; await OpenResearchCommunity.jsonRequest(url, options); await load(); } catch (error) { host.querySelector('.error').textContent = error.message; } finally { OpenResearchCommunity.setBusy(button,false); } };
    }
    async function deleteComment(commentId) { if (!confirm('确定要删除这条评论吗？删除后会保留 [已删除] 占位。')) return; try { await OpenResearchCommunity.jsonRequest(`/api/comments/${commentId}`, {method:'DELETE'}); await load(); } catch (error) { alert(error.message); } }
    async function submitComment(event) { event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button'); OpenResearchCommunity.setBusy(button,true); try { await OpenResearchCommunity.jsonRequest(`/api/discussions/${id}/comments`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:form.elements.content.value})}); await load(); } catch (error) { form.querySelector('.error').textContent = error.message; } finally { OpenResearchCommunity.setBusy(button,false); } }
    async function action(label, url, method='POST') { try { await OpenResearchCommunity.jsonRequest(url, {method}); await load(); } catch (error) { alert(error.message); } }
    async function load() { const response = await OpenResearchAuth.request(`/api/discussions/${id}`); if (!response.ok) throw new Error(await errorText(response)); discussion = await response.json(); render(); }
    async function start() { await OpenResearchAuth.init(); OpenResearchAuth.mountNav('[data-auth-nav]'); await load(); }
    start().catch(error => { app.innerHTML = `<section class="card"><h2>无法加载讨论</h2><div class="error">${esc(error.message)}</div></section>`; });
  })();
  </script>
</body>
</html>
