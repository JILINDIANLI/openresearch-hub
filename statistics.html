<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公开统计 · 开放研究中心</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="/auth.js"></script>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--ink:#17202a;--muted:#71808d;--line:#e2e8ef;--accent:#3459d4;--accent-soft:#edf2ff;--green:#12856a;--shadow:0 16px 44px rgba(33,50,70,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC",system-ui,sans-serif}a{color:inherit;text-decoration:none}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,76px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}.mark{width:27px;height:27px;border-radius:8px;background:#17202a;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}.mark i{background:#9db7ff;border-radius:2px}.mark i:nth-child(2){opacity:.65}.mark i:nth-child(3){opacity:.3}.top-actions{display:flex;align-items:center;gap:10px}.top-actions>a{font-size:12px;color:#5d6b79;padding:8px 10px}.top-actions>a:hover{color:var(--accent)}.wrap{max-width:1180px;margin:0 auto;padding:58px 22px 80px}.eyebrow{color:var(--accent);font:600 10px "DM Mono",monospace;letter-spacing:1.1px;margin:0 0 10px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:26px}.heading h1{font-size:42px;letter-spacing:-1.8px;margin:0}.heading p{color:var(--muted);font-size:13px;line-height:1.7;margin:10px 0 0;max-width:650px}.generated{color:var(--muted);font:10px "DM Mono",monospace;white-space:nowrap}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:26px 0 20px}.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 19px;box-shadow:var(--shadow)}.metric small{color:var(--muted);font-size:11px}.metric strong{display:block;font:600 29px "DM Mono",monospace;letter-spacing:-1.2px;margin-top:10px}.metric span{color:var(--green);font-size:10px;display:block;margin-top:5px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:19px}.card h2{font-size:15px;margin:0}.card p{color:var(--muted);font-size:11px;margin:6px 0 0}.chart{height:300px;margin-top:12px}.areas{display:grid;gap:10px;margin-top:18px}.area{display:grid;grid-template-columns:1fr 56px;align-items:center;gap:10px}.area-title{display:flex;justify-content:space-between;color:#51606d;font-size:11px;margin-bottom:5px}.track{height:7px;background:#eef2f6;border-radius:99px;overflow:hidden}.track i{height:100%;display:block;background:linear-gradient(90deg,#6884ed,#3459d4);border-radius:99px}.area>b{font:600 12px "DM Mono",monospace;text-align:right}.researchers{display:grid;gap:10px;margin-top:16px}.researcher{display:flex;align-items:center;gap:10px;border-top:1px solid #edf0f3;padding-top:10px}.researcher:first-child{border-top:0;padding-top:0}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.researcher strong{font-size:11px}.researcher small{color:var(--muted);display:block;font-size:10px;margin-top:3px}.researcher b{margin-left:auto;font:500 11px "DM Mono",monospace}.empty{color:var(--muted);font-size:12px;padding:28px 0;text-align:center}@media(max-width:850px){.overview{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.heading{display:block}.generated{display:block;margin-top:12px}}@media(max-width:520px){.overview{grid-template-columns:1fr}.heading h1{font-size:34px}.wrap{padding:38px 15px 55px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span>开放研究中心</a><div class="top-actions"><a href="/">浏览</a><a href="/search">搜索</a><span data-auth-nav></span></div></header>
  <main class="wrap">
    <div class="heading"><div><p class="eyebrow">开放研究中心 / 公开统计</p><h1>研究活动概览</h1><p>用真实资源、下载、社区和贡献者数据，观察平台上的研究如何增长、流动并被复用。</p></div><span class="generated" id="generatedAt">正在加载…</span></div>
    <section class="overview" id="overview"><div class="metric"><small>研究者</small><strong>—</strong><span>公开贡献者</span></div><div class="metric"><small>资源</small><strong>—</strong><span>已发布资源</span></div><div class="metric"><small>项目</small><strong>—</strong><span>公开项目</span></div><div class="metric"><small>下载量</small><strong>—</strong><span>累计使用数据</span></div></section>
    <section class="grid"><div class="card"><h2>资源增长</h2><p>过去 30 天公开资源与研究者贡献趋势</p><div class="chart" id="growthChart"></div></div><div class="card"><h2>资源分布</h2><p>按资源类型查看公开内容结构</p><div class="chart" id="distributionChart"></div></div></section>
    <section class="grid"><div class="card"><h2>下载趋势</h2><p>过去 30 天资源下载活动</p><div class="chart" id="downloadChart"></div></div><div class="card"><h2>社区活动</h2><p>讨论、Issue 与评论的公开活动</p><div class="chart" id="communityChart"></div></div></section>
    <section class="grid"><div class="card"><h2>研究领域</h2><p>资源标签与研究方向的聚合统计</p><div class="areas" id="areas"></div></div><div class="card"><h2>活跃研究者</h2><p>按贡献资源、Stars 与下载量排序</p><div class="researchers" id="researchers"></div></div></section>
  </main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const initials=v=>(v||'OR').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const fmt=n=>Number(n||0).toLocaleString('en-US');
    const chartTheme={textStyle:{fontFamily:'Inter,"Noto Sans SC",sans-serif'},color:['#3459d4','#7d91e9','#14a27d','#e0a43a'],grid:{left:38,right:18,top:28,bottom:28},tooltip:{trigger:'axis'}};
    function lineChart(id,series){const node=document.querySelector(id);const chart=echarts.init(node);chart.setOption({...chartTheme,xAxis:{type:'category',boundaryGap:false,data:series.labels,axisLine:{lineStyle:{color:'#dfe5eb'}},axisLabel:{color:'#8995a0',fontSize:10}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#edf0f3'}},axisLabel:{color:'#8995a0',fontSize:10}},series:series.lines.map(item=>({name:item.name,type:'line',smooth:true,symbol:'none',areaStyle:item.area?{opacity:.08}:undefined,data:item.data}))});return chart}
    function barChart(id,labels,data,name,color){const chart=echarts.init(document.querySelector(id));chart.setOption({...chartTheme,xAxis:{type:'category',data:labels,axisLabel:{color:'#8995a0',fontSize:10}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#edf0f3'}},axisLabel:{color:'#8995a0',fontSize:10}},series:[{name,type:'bar',barMaxWidth:22,itemStyle:{color},data}]});return chart}
    async function load(){const response=await fetch('/api/statistics');if(!response.ok)throw new Error('统计服务暂不可用');const data=await response.json();document.querySelector('#generatedAt').textContent='更新时间：'+new Date(data.generated_at).toLocaleString('zh-CN');const values=[data.overview.researchers,data.overview.resources,data.overview.projects,data.overview.downloads];document.querySelectorAll('.metric strong').forEach((node,index)=>node.textContent=fmt(values[index]));const labels=data.resource_growth.map(item=>item.date.slice(5));lineChart('#growthChart',{labels,lines:[{name:'资源',data:data.resource_growth.map(item=>item.resources),area:true},{name:'研究者',data:data.resource_growth.map(item=>item.researchers)}]});const dist=echarts.init(document.querySelector('#distributionChart'));dist.setOption({tooltip:{trigger:'item'},legend:{bottom:4,textStyle:{fontSize:10}},series:[{type:'pie',radius:['42%','70%'],center:['50%','46%'],label:{fontSize:10},data:data.resource_distribution.map(item=>({name:({model:'模型',dataset:'数据集',algorithm:'算法',project:'项目',paper:'论文',demo:'演示',tutorial:'教程'})[String(item.type||'').toLowerCase()]||item.type,data:item.count,value:item.count}))}]});barChart('#downloadChart',data.download_trend.map(item=>item.date.slice(5)),data.download_trend.map(item=>item.downloads),'下载量','#3459d4');lineChart('#communityChart',{labels,lines:[{name:'讨论',data:data.community_activity.map(item=>item.discussions)},{name:'问题',data:data.community_activity.map(item=>item.issues)},{name:'评论',data:data.community_activity.map(item=>item.comments)}]});const max=Math.max(...data.research_areas.map(item=>item.count),1);document.querySelector('#areas').innerHTML=data.research_areas.length?data.research_areas.map(item=>`<div class="area"><div><div class="area-title"><span>${esc(item.name)}</span><span>${fmt(item.count)} 个资源</span></div><div class="track"><i style="width:${Math.max(6,item.count/max*100)}%"></i></div></div><b>${fmt(item.count)}</b></div>`).join(''):'<div class="empty">No research area data yet.</div>';document.querySelector('#researchers').innerHTML=data.active_researchers.length?data.active_researchers.map(item=>`<a class="researcher" href="/users/${encodeURIComponent(item.username)}"><span class="avatar">${item.avatar_url?`<img src="${esc(item.avatar_url)}" alt="">`:initials(item.display_name)}</span><span><strong>${esc(item.display_name)}</strong><small>${esc(item.organization||'开放研究中心贡献者')} · ${fmt(item.stars)} 次收藏</small></span><b>${fmt(item.resource_count)}</b></a>`).join(''):'<div class="empty">No researcher data yet.</div>';window.addEventListener('resize',()=>Object.values(echarts.getInstanceByDom?{}:{}));}
    OpenResearchAuth.init().then(()=>OpenResearchAuth.mountNav(document.querySelector('[data-auth-nav]'))).catch(()=>{});load().catch(error=>{document.querySelector('#generatedAt').textContent=error.message});lucide.createIcons();
  </script>
</body>
</html>
