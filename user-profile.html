<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>研究者资料 · 开放研究中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="/auth.js"></script>
  <style>
    :root{--ink:#17202a;--muted:#73818d;--line:#e0e6ea;--paper:#f7f9fb;--blue:#246bfd;--blue-soft:#eaf1ff;--green:#17856d}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:"DM Sans",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:30px;padding:0 clamp(20px,5vw,76px)}.brand{display:flex;align-items:center;gap:10px;font:800 19px Manrope,sans-serif;letter-spacing:-.02em}.mark{width:28px;height:28px;border-radius:8px;background:#17202a;position:relative}.mark i{position:absolute;top:7px;left:11px;width:5px;height:15px;border-radius:3px;background:#80e9c1;transform:rotate(25deg)}.mark i:nth-child(2){background:#9abaff;transform:translateX(6px) rotate(25deg)}.mark i:nth-child(3){background:#f5c76d;transform:translateX(-6px) rotate(25deg)}.nav{display:flex;gap:19px;flex:1;height:72px;align-items:center}.nav a{font-size:12px;color:#697784;font-weight:600}.nav a:hover{color:var(--ink)}.nav-actions{display:flex;align-items:center;gap:9px}.publish{border:0;border-radius:8px;padding:9px 12px;color:#fff;background:#17202a;font-weight:800;font-size:12px}.wrap{width:min(1150px,calc(100% - 36px));margin:36px auto 80px}.profile{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 16px 45px rgba(35,54,74,.07)}.cover{height:128px;background:linear-gradient(118deg,#1d344f,#275c82 48%,#369b91);position:relative;overflow:hidden}.cover:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff1c 1px,transparent 1px),linear-gradient(90deg,#ffffff1c 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,#000,transparent)}.profile-main{padding:0 38px 30px}.avatar{width:102px;height:102px;border-radius:22px;border:5px solid #fff;background:#17202a;color:#fff;display:grid;place-items:center;font:800 29px Manrope,sans-serif;margin-top:-45px;position:relative;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profile-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.profile h1{font:800 clamp(27px,4vw,39px) Manrope,sans-serif;letter-spacing:-.045em;margin:16px 0 3px}.handle{color:var(--muted);font-size:14px}.org{display:flex;align-items:center;gap:7px;color:#5d6a76;font-size:13px;margin-top:13px}.org svg{width:15px;color:#8d9aa4}.bio{max-width:730px;margin:17px 0 0;color:#576571;line-height:1.75;font-size:14px}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.links a{color:var(--blue);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px}.links svg{width:14px}.joined{color:#7c8995;font-size:12px;white-space:nowrap;margin-bottom:4px}.interests{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.interest{border-radius:7px;background:#f0f4f7;color:#52616e;font-size:12px;padding:7px 9px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(6,1fr);margin-top:22px;border-top:1px solid var(--line);padding-top:22px}.stat{padding-right:14px;border-right:1px solid var(--line);margin-right:14px}.stat:last-child{border-right:0}.stat strong{font:800 20px Manrope,sans-serif;display:block}.stat span{color:#81909a;font-size:11px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:30px;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:#778490;padding:14px 1px;font:700 12px "DM Sans";white-space:nowrap}.tabs button.active{color:#17202a;border-color:var(--blue)}.resource-area{padding-top:25px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.section-head h2{font:800 22px Manrope,sans-serif;letter-spacing:-.03em;margin:0}.section-head span{color:#87949f;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;min-height:172px;display:flex;flex-direction:column;transition:.16s transform,.16s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(35,54,74,.09)}.badge{display:inline-flex;width:max-content;border-radius:6px;padding:5px 7px;background:var(--blue-soft);color:#205bd4;font-size:10px;font-weight:800;letter-spacing:.07em}.card h3{font:800 17px Manrope,sans-serif;margin:14px 0 7px;letter-spacing:-.02em}.card p{color:#71808d;font-size:12px;line-height:1.65;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card footer{margin-top:auto;padding-top:15px;color:#8a98a3;font-size:11px;display:flex;justify-content:space-between}.empty,.error{background:#fff;border:1px dashed #cdd8df;border-radius:11px;padding:35px;text-align:center;color:#778590}.error{color:#ad3b48}.loading{padding:35px;color:#7d8994}@media(max-width:860px){.stats{grid-template-columns:repeat(3,1fr);gap:18px}.stat{border-right:0}.cards{grid-template-columns:repeat(2,1fr)}.nav{display:none}.topbar{justify-content:space-between}.profile-main{padding:0 22px 24px}}@media(max-width:550px){.wrap{width:min(100% - 22px,1150px);margin-top:20px}.profile-top{display:block}.joined{margin-top:17px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.topbar{padding:0 14px}.brand{font-size:16px}}
  </style>
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><span class="mark"><i></i><i></i><i></i></span>开放研究中心</a><nav class="nav"><a href="/">浏览</a><a href="/#models">模型</a><a href="/#datasets">数据集</a><a href="/#projects">项目</a></nav><div class="nav-actions"><a href="/publish" class="publish">+ 发布</a><span data-auth-nav></span></div></header>
  <main class="wrap"><div id="app" class="loading">正在加载研究者资料…</div></main>
  <script>
    const app=document.querySelector('#app'),username=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()),typeNames={model:'模型',dataset:'数据集',algorithm:'算法',project:'项目',paper:'论文',demo:'演示',tutorial:'教程'};let resources=[],starResources=[],favoriteResources=[],profileUser=null,selected='overview';const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const initials=user=>(user.display_name||user.username).split(/[\s_-]+/).filter(Boolean).map(v=>v[0]).join('').slice(0,2).toUpperCase();function count(type){return resources.filter(item=>item.resource_type===type).length}function card(item){return `<a class="card" href="/resources/${item.id}"><span class="badge">${esc(typeNames[item.resource_type]||item.resource_type)}</span><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><footer><span><i data-lucide="star" style="width:12px;vertical-align:-2px"></i> ${Number(item.stars_count??item.stars??0).toLocaleString()} · <i data-lucide="download" style="width:12px;vertical-align:-2px"></i> ${Number(item.downloads_count??item.downloads??0).toLocaleString()}</span><span>${new Date(item.created_time).toLocaleDateString('zh-CN')}</span></footer></a>`}function activeResources(){if(selected==='stars')return starResources;if(selected==='favorites')return favoriteResources;return selected==='overview'?resources:resources.filter(item=>item.resource_type===selected)}function render(){const user=profileUser,interests=(user.research_interests||[]).map(v=>`<span class="interest">${esc(v)}</span>`).join('')||'<span class="interest">暂未填写研究兴趣</span>',avatar=user.avatar_url?`<img src="${esc(user.avatar_url)}" alt="">`:esc(initials(user)),isSelf=OpenResearchAuth.currentUser?.id===user.id,stats=[['resources','资源'],['model','模型'],['dataset','数据集'],['algorithm','算法'],['project','项目'],['paper','论文']],tabTypes=['overview','model','dataset','algorithm','project','paper','demo','stars',...(isSelf?['favorites']:[])],visible=activeResources(),heading=selected==='overview'?'最近资源':selected==='stars'?'已收藏资源':selected==='favorites'?'我的收藏':typeNames[selected];app.innerHTML=`<section class="profile"><div class="cover"></div><div class="profile-main"><div class="profile-top"><div><div class="avatar">${avatar}</div><h1>${esc(user.display_name||user.username)}</h1><div class="handle">@${esc(user.username)}</div><div class="org"><i data-lucide="building-2"></i>${esc(user.organization||'独立研究者')}</div></div><div class="joined"><i data-lucide="calendar-days" style="width:14px;vertical-align:-3px"></i> 加入时间：${new Date(user.created_at).toLocaleDateString('zh-CN')}</div></div><p class="bio">${esc(user.bio||'这位研究者暂未填写个人简介。')}</p><div class="links">${user.website_url?`<a href="${esc(user.website_url)}" target="_blank" rel="noreferrer"><i data-lucide="globe-2"></i>个人网站</a>`:''}${user.github_url?`<a href="${esc(user.github_url)}" target="_blank" rel="noreferrer"><i data-lucide="github"></i>GitHub</a>`:''}</div><div class="interests">${interests}</div><div class="stats">${stats.map(([type,label])=>`<div class="stat"><strong>${type==='resources'?resources.length:count(type)}</strong><span>${label}</span></div>`).join('')}</div></div></section><nav class="tabs">${tabTypes.map(type=>`<button data-tab="${type}" class="${selected===type?'active':''}">${type==='overview'?'概览':type==='stars'?'收藏':type==='favorites'?'我的收藏':typeNames[type]}</button>`).join('')}</nav><section class="resource-area" id="resources"><div class="section-head"><h2>${heading}</h2><span>${visible.length} 个资源</span></div>${visible.length?`<div class="cards">${visible.map(card).join('')}</div>`:`<div class="empty">${selected==='favorites'?'你还没有收藏任何资源。':'该分类下暂无已发布资源。'}</div>`}</section>`;app.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.tab;render()}));lucide.createIcons()}async function init(){await OpenResearchAuth.init();const profile=await fetch('/api/users/'+encodeURIComponent(username));if(!profile.ok)throw new Error((await profile.json().catch(()=>({}))).detail||'用户不存在');profileUser=await profile.json();const requests=[fetch('/api/users/'+encodeURIComponent(username)+'/resources'),fetch('/api/users/'+encodeURIComponent(username)+'/stars')];if(OpenResearchAuth.currentUser?.id===profileUser.id)requests.push(OpenResearchAuth.request('/api/me/favorites'));const responses=await Promise.all(requests);resources=responses[0].ok?await responses[0].json():[];starResources=responses[1].ok?await responses[1].json():[];favoriteResources=responses[2]?.ok?await responses[2].json():[];document.title=`${profileUser.display_name||profileUser.username} · 开放研究中心`;render()}init().catch(error=>{app.className='error';app.textContent=error.message});
  </script>
<script>
/* V9 follower counts and Follow / Following control. */
(()=>{let bound=false;async function enhance(){if(!profileUser||bound)return;bound=true;const r=await OpenResearchAuth.request('/api/users/'+encodeURIComponent(profileUser.username)+'/follow-state');if(!r.ok)return;const state=await r.json();const stats=document.querySelector('.stats');if(stats&&!stats.querySelector('[data-v9-followers]')){const node=document.createElement('div');node.className='stat';node.dataset.v9Followers='1';node.innerHTML=`<strong>${state.followers_count}</strong><span>Followers</span>`;stats.appendChild(node);const node2=document.createElement('div');node2.className='stat';node2.innerHTML=`<strong>${state.following_count}</strong><span>Following</span>`;stats.appendChild(node2)}const top=document.querySelector('.profile-top');if(top&&OpenResearchAuth.currentUser?.id!==profileUser.id&&!top.querySelector('[data-v9-follow]')){const b=document.createElement('button');b.dataset.v9Follow='1';b.className='publish';b.textContent=state.is_following?'Following':'Follow';b.onclick=async()=>{if(!OpenResearchAuth.isAuthenticated())return OpenResearchAuth.redirectToLogin('Please sign in to follow researchers.');const response=await OpenResearchAuth.request('/api/users/'+encodeURIComponent(profileUser.username)+'/follow',{method:state.is_following?'DELETE':'POST'});if(response.ok){bound=false;enhance()}};top.appendChild(b)}}const timer=setInterval(()=>{if(profileUser){clearInterval(timer);enhance()}},200)})();
</script>
</body>
</html>
