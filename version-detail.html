<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>版本发布 · 开放研究中心</title>
  <script src="https://unpkg.com/lucide@latest"></script><script src="/auth.js"></script>
  <style>
    :root{--ink:#17202a;--muted:#71808d;--line:#e1e7eb;--paper:#f7f9fb;--blue:#246bfd;--red:#bd4551}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px system-ui,sans-serif;color:var(--ink)}a{text-decoration:none;color:var(--blue)}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1080px)/2))}.brand{font-weight:800;font-size:17px;color:var(--ink)}.wrap{width:min(960px,calc(100% - 30px));margin:32px auto 80px}.crumb{font-size:13px;color:var(--muted);margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin:16px 0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.version{font-size:34px;font-weight:800;margin:4px 0}.badge{display:inline-block;padding:5px 8px;border-radius:5px;background:#eaf1ff;color:#1f5bd2;font-size:11px;font-weight:800}.badge.archived{background:#f0f2f4;color:#687582}.meta{color:var(--muted);font-size:13px;line-height:1.8}.notes{line-height:1.75;white-space:normal}.notes pre{overflow:auto;background:#111827;color:#e5edf5;padding:14px;border-radius:7px}.files{width:100%;border-collapse:collapse}.files td,.files th{padding:12px 5px;border-top:1px solid #edf0f2;text-align:left}.files th{font-size:10px;color:#87939e;text-transform:uppercase}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 12px;font-weight:750;cursor:pointer}.btn.primary{background:#17202a;color:#fff;border-color:#17202a}.btn.danger{color:#a93340;border-color:#f1cbd0}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit}.field textarea{min-height:120px}.admin{display:none}.error{color:var(--red)}@media(max-width:600px){.top{padding:0 15px}.hero{display:block}.version{font-size:28px}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">开放研究中心</a><nav data-auth-nav></nav></header>
  <main class="wrap" id="app"><div class="card">正在加载版本…</div></main>
  <script>
  (() => {
    const parts=location.pathname.split('/').filter(Boolean), resourceId=parts[1], version=decodeURIComponent(parts[3]||'');
    const app=document.querySelector('#app'); let resource,release,branches=[];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const markdown=v=>esc(v||'暂无发布说明。').replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
    const fmt=n=>n<1024?`${n} B`:`${(n/1024/1024).toFixed(1)} MB`;
    const owner=()=>OpenResearchAuth.currentUser&&resource.author_id===OpenResearchAuth.currentUser.id;
    async function api(path,opts){const r=await OpenResearchAuth.request(path,opts);if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'请求失败');}return r.status===204?null:r.json()}
    async function load(){await OpenResearchAuth.init();OpenResearchAuth.mountNav('[data-auth-nav]');resource=await api(`/api/resources/${resourceId}`);release=await api(`/api/resources/${resourceId}/versions/${encodeURIComponent(version)}`);try{const repo=await api(`/api/resources/${resourceId}/repository`);branches=await api(`/api/resources/${resourceId}/repository/branches`)}catch(_){branches=[]}render()}
    function statusBadge(){return `<span class="badge ${release.status==='ARCHIVED'?'archived':''}">${esc(({DRAFT:'草稿',PUBLISHED:'已发布',ARCHIVED:'已归档'})[release.status]||release.status)}${release.is_latest?' · 最新版本':''}</span>`}
    function editMarkup(){if(!owner()||release.status!=='DRAFT')return '';return `<section class="card admin"><h2>编辑草稿</h2><form id="editForm"><label class="field">标题<input name="title" value="${esc(release.title)}"></label><label class="field">Git 分支 ${branches.length?`<select name="git_branch"><option value="">未选择分支</option>${branches.map(b=>`<option ${release.git_branch===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`:`<input name="git_branch" value="${esc(release.git_branch||'')}">`}</label><label class="field">Git 提交记录<input name="git_commit_sha" value="${esc(release.git_commit_sha||'')}"></label><label class="field">简介<textarea name="description">${esc(release.description)}</textarea></label><label class="field">发布说明<textarea name="release_notes">${esc(release.release_notes)}</textarea></label><div class="actions"><button class="btn primary">保存草稿</button><button type="button" class="btn" data-upload>上传版本文件</button><button type="button" class="btn primary" data-publish>发布版本</button><button type="button" class="btn danger" data-delete>删除草稿</button></div><p class="error" id="formError"></p></form><form id="uploadForm" style="display:none;margin-top:18px"><label class="field">文件<input name="file" type="file" required></label><label class="field">文件类型<select name="file_kind"><option value="MODEL_WEIGHT">模型权重</option><option value="DATASET">数据集</option><option value="PAPER">论文</option><option value="CODE">代码</option><option value="CONFIG">配置文件</option><option value="DOCUMENT">文档</option><option value="RESULT">结果</option><option value="OTHER">其他</option></select></label><label class="field">说明<input name="description"></label><button class="btn primary">上传</button></form></section>`}
    function render(){document.title=`v${release.version} · ${resource.title}`;app.innerHTML=`<div class="crumb"><a href="/resources/${resourceId}">${esc(resource.title)}</a> / 版本 / v${esc(release.version)}</div><section class="card hero"><div>${statusBadge()}<h1 class="version">v${esc(release.version)}</h1><h2>${esc(release.title||'未命名版本')}</h2><div class="meta">发布者：${esc(release.publisher.display_name||release.publisher.username||'开放研究中心')} · ${release.published_at?new Date(release.published_at).toLocaleString('zh-CN'):'草稿'} · ${release.downloads_count} 次下载</div></div><div class="actions">${release.git_commit_sha?`<a class="btn" href="/resources/${resourceId}">源提交 ${esc(release.git_commit_sha.slice(0,8))}</a>`:''}${owner()&&release.status==='PUBLISHED'?'<button class="btn" data-archive>归档</button>':''}</div></section><section class="card"><h2>发布说明</h2><div class="notes"><p>${markdown(release.release_notes)}</p></div></section><section class="card"><h2>版本文件</h2>${release.files.length?`<table class="files"><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>下载量</th><th></th></tr></thead><tbody>${release.files.map(f=>`<tr><td>${esc(f.original_filename)}</td><td>${esc(f.file_kind)}</td><td>${fmt(f.file_size)}</td><td>${f.download_count}</td><td><a href="${esc(f.download_url)}">下载</a></td></tr>`).join('')}</tbody></table>`:'<p class="meta">暂未上传版本文件。</p>'}</section>${editMarkup()}`;if(owner()&&release.status==='DRAFT'){const form=document.querySelector('#editForm');form.addEventListener('submit',async e=>{e.preventDefault();try{release=await api(`/api/resources/${resourceId}/versions/${encodeURIComponent(version)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});render()}catch(err){document.querySelector('#formError').textContent=err.message}});document.querySelector('[data-upload]').onclick=()=>document.querySelector('#uploadForm').style.display='block';document.querySelector('#uploadForm').addEventListener('submit',async e=>{e.preventDefault();try{await api(`/api/resources/${resourceId}/versions/${encodeURIComponent(version)}/files`,{method:'POST',body:new FormData(e.currentTarget)});await load()}catch(err){document.querySelector('#formError').textContent=err.message}});document.querySelector('[data-publish]').onclick=async()=>{try{release=await api(`/api/resources/${resourceId}/versions/${encodeURIComponent(version)}/publish`,{method:'POST'});render()}catch(err){document.querySelector('#formError').textContent=err.message}};document.querySelector('[data-delete]').onclick=async()=>{if(confirm('确定要删除此草稿及其版本文件吗？')){await api(`/api/resources/${resourceId}/versions/${encodeURIComponent(version)}`,{method:'DELETE'});location.href=`/resources/${resourceId}`}}}document.querySelector('[data-archive]')?.addEventListener('click',async()=>{release=await api(`/api/resources/${resourceId}/versions/${encodeURIComponent(version)}/archive`,{method:'POST'});render()});window.lucide?.createIcons()}
    load().catch(e=>app.innerHTML=`<section class="card error">${esc(e.message)}</section>`);
  })();
  </script>
</body>
</html>
