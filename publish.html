<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>发布资源 · 开放研究中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/auth.js"></script>
  <style>
    :root { --ink:#17202a; --muted:#6e7b87; --line:#e3e8ec; --paper:#f7f9fb; --white:#fff; --blue:#246bfd; --blue-soft:#eaf1ff; --green:#16856b; --red:#be4350; --shadow:0 20px 55px rgba(33,50,70,.10); }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:"DM Sans",system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; } .topbar { height:72px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,5vw,76px); }
    .brand { display:flex; align-items:center; gap:11px; font:800 19px Manrope,sans-serif; letter-spacing:-.02em; } .mark { width:28px; height:28px; border-radius:8px; background:#17202a; display:grid; place-items:center; position:relative; } .mark i { display:block; position:absolute; width:5px; height:15px; border-radius:3px; background:#7ee7bd; transform:rotate(25deg); } .mark i:nth-child(2){background:#8fb4ff; transform:translateX(6px) rotate(25deg)} .mark i:nth-child(3){background:#f7c46c; transform:translateX(-6px) rotate(25deg)}
    .top-actions { display:flex; gap:10px; align-items:center; } .top-actions a,.ghost { border:1px solid var(--line); border-radius:9px; padding:10px 14px; color:#475563; background:#fff; font-weight:600; font-size:13px; } .top-actions a:hover,.ghost:hover{border-color:#b7c4d0;background:#fbfcff}
    main { width:min(1120px, calc(100% - 36px)); margin:42px auto 70px; } .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } h1 { font:800 clamp(30px,4vw,44px) Manrope,sans-serif; letter-spacing:-.04em; margin:10px 0 9px; } .intro { color:var(--muted); max-width:680px; line-height:1.7; margin:0 0 28px; }
    .layout { display:grid; grid-template-columns:260px minmax(0,1fr); gap:22px; align-items:start; } .panel { background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); } .types { padding:14px; position:sticky; top:20px; } .types h2 { font:700 13px Manrope,sans-serif; margin:2px 6px 13px; color:#5b6875; text-transform:uppercase; letter-spacing:.08em; }
    .type-btn { width:100%; display:flex; gap:12px; align-items:center; text-align:left; border:1px solid transparent; background:transparent; border-radius:10px; padding:12px 10px; cursor:pointer; color:#4f5d6a; } .type-btn svg { width:18px; } .type-btn strong { display:block; color:var(--ink); font-size:14px; } .type-btn span { display:block; font-size:11px; color:#8b97a2; margin-top:3px; } .type-btn.active { background:var(--blue-soft); border-color:#cbdcff; color:var(--blue); } .type-btn.active strong { color:#1d56ca; }
    form { padding:27px clamp(20px,4vw,38px) 34px; } .section-title { display:flex; align-items:center; gap:10px; margin:0 0 17px; font:700 18px Manrope,sans-serif; } .section-title span { display:grid; place-items:center; width:25px; height:25px; border-radius:8px; background:#eff4f8; color:var(--blue); font-size:12px; } .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; } .field { display:flex; flex-direction:column; gap:7px; margin-bottom:18px; } .field.full { grid-column:1/-1; } label { color:#374553; font-size:13px; font-weight:700; } input,textarea,select { width:100%; border:1px solid #d8e0e6; border-radius:8px; padding:12px 13px; font:inherit; color:var(--ink); background:#fff; outline:none; transition:.15s border,.15s box-shadow; } input:focus,textarea:focus,select:focus { border-color:#79a3ff; box-shadow:0 0 0 4px #eaf1ff; } textarea { resize:vertical; min-height:126px; line-height:1.6; } .hint { color:#93a0aa; font-size:11px; font-weight:400; } .detail-box { margin-top:4px; padding-top:24px; border-top:1px solid var(--line); } .detail-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; } .status { display:none; border-radius:8px; padding:11px 13px; margin:6px 0 18px; font-size:13px; line-height:1.5; } .status.error { display:block; color:#9d3342; background:#fff0f1; border:1px solid #f4c6cc; } .status.success { display:block; color:#116c57; background:#ecfbf5; border:1px solid #bdebd9; }
    .form-actions { border-top:1px solid var(--line); margin-top:6px; padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:12px; } .form-actions small { color:#8b97a2; line-height:1.5; } button.submit { border:0; border-radius:9px; background:#17202a; color:#fff; padding:12px 18px; font-weight:700; cursor:pointer; min-width:150px; } button.submit:hover { background:#2c3a48; } button.submit:disabled { opacity:.55; cursor:wait; }
    .auth-guard { min-height:430px; display:grid; place-items:center; text-align:center; padding:35px; } .auth-guard .guard-inner{max-width:440px}.auth-guard h2{font:800 30px Manrope,sans-serif;letter-spacing:-.04em;margin:0 0 12px}.auth-guard p{color:var(--muted);line-height:1.7;margin:0 0 23px}.guard-actions{display:flex;justify-content:center;gap:10px}.guard-actions a{border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13px;font-weight:800}.guard-actions a.primary-guard{background:#17202a;color:#fff;border-color:#17202a}
    @media(max-width:800px){ .layout{grid-template-columns:1fr}.types{position:static}.type-btn{display:inline-flex;width:calc(50% - 6px);vertical-align:top}.grid,.detail-fields{grid-template-columns:1fr}.field.full{grid-column:auto}.types h2{margin-bottom:8px}.form-actions{align-items:flex-start;flex-direction:column}.form-actions button{width:100%} }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span><span>开放研究中心</span></a><div class="top-actions"><a href="/">返回浏览</a><span data-auth-nav></span></div></header>
  <main>
    <div class="eyebrow">参与开放研究</div><h1>发布资源</h1><p class="intro">把可复现的模型、数据、算法与项目交给团队和社区。发布后会立即进入资源中心，方便外部浏览和内部协作。</p>
    <div class="layout"><aside class="panel types"><h2>资源类型</h2><div id="typeList"></div></aside><section class="panel"><form id="resourceForm" novalidate>
      <div class="section-title"><span>01</span>基本信息</div>
      <div class="grid"><div class="field full"><label for="title">标题 <span class="hint">3 至 150 个字符</span></label><input id="title" required minlength="3" maxlength="150" placeholder="例如：YOLO-UAV" /></div>
      <div class="field full"><label for="description">简介 <span class="hint">至少 10 个字符</span></label><textarea id="description" required minlength="10" maxlength="10000" placeholder="用几句话说明资源解决什么问题、适用什么场景，以及如何开始使用。"></textarea></div>
      <div class="field"><label for="research_field">研究领域</label><input id="research_field" placeholder="计算机视觉 / 机器人" /></div><div class="field"><label for="license">许可证</label><select id="license"><option>Apache-2.0</option><option>MIT</option><option>CC BY 4.0</option><option>BSD-3-Clause</option><option>其他</option></select></div>
      <div class="field"><label for="tags">标签 <span class="hint">用逗号分隔</span></label><input id="tags" placeholder="无人机、深度学习、可复现" /></div><div class="field"><label for="repository_url">代码仓库链接 <span class="hint">可选</span></label><input id="repository_url" type="url" placeholder="https://github.com/..." /></div>
      <div class="field"><label for="homepage_url">主页链接 <span class="hint">可选</span></label><input id="homepage_url" type="url" placeholder="https://..." /></div><div class="field"><label for="thumbnail_url">缩略图链接 <span class="hint">可选</span></label><input id="thumbnail_url" type="url" placeholder="https://.../cover.png" /></div></div>
      <div class="detail-box"><div class="section-title"><span>02</span><span id="detail标题">模型信息</span></div><div id="detailFields" class="detail-fields"></div></div>
      <div id="status" class="status"></div><div class="form-actions"><small>发布即表示你有权分享这些内容，并会遵守所选许可协议。</small><button class="submit" id="submitBtn" type="submit"><i data-lucide="send" style="width:15px;vertical-align:-3px;margin-right:6px"></i>发布资源</button></div>
    </form></section></div>
  </main>
  <script>
    const types=[['model','模型','模型与权重','box'],['dataset','数据集','数据集与基准','database'],['algorithm','算法','方法与实现','braces'],['project','项目','完整科研项目','folder-git-2'],['paper','论文','论文与关联资源','file-text'],['demo','演示','视频与可运行演示','play'],['tutorial','教程','复现与上手教程','book-open']];
    const detailConfig={model:{title:'模型信息',fields:[['framework','框架','text','PyTorch / TensorFlow'],['task','任务','text','目标检测'],['parameters','参数量','text','36M'],['model_url','模型 URL','url','https://...']]},dataset:{title:'数据集信息',fields:[['size','大小','text','18.4 GB'],['format','格式','text','images + JSON'],['task','任务','text','目标检测'],['download_url','Download URL','url','https://...']]},algorithm:{title:'算法信息',fields:[['category','类别','text','强化学习'],['difficulty','难度','select',''],['paper_url','论文 URL','url','https://doi.org/...'],['code_url','代码链接','url','https://github.com/...']]},project:{title:'项目信息',fields:[['github_url','GitHub 链接','url','https://github.com/...'],['paper_url','论文 URL','url','https://doi.org/...'],['demo_url','演示 URL','url','https://...'],['members','成员','text','Kai Shen, Lena Wu']]},paper:{title:'论文信息',fields:[['authors','作者','text','Kai Shen, Lena Wu'],['journal','期刊','text','Open Research 期刊'],['year','年份','number','2026'],['doi','DOI','text','10.0000/...'],['pdf_url','PDF URL','url','https://...']]},demo:{title:'演示信息',fields:[['video_url','视频链接','url','https://youtube.com/...'],['project_url','项目 URL','url','https://github.com/...'],['duration','时长','text','03:42']]},tutorial:{title:'教程信息',fields:[['difficulty','难度','select',''],['duration','时长','text','20 min'],['content_url','Content URL','url','https://...']]}};
    const editId=new URLSearchParams(location.search).get('edit');let editResource=null;let selected='model'; const list=document.querySelector('#typeList'), detailFields=document.querySelector('#detailFields');
    function drawTypes(){list.innerHTML=types.map(([id,name,desc,icon])=>`<button type="button" class="type-btn ${id===selected?'active':''}" data-type="${id}"><i data-lucide="${icon}"></i><span><strong>${name}</strong><span>${desc}</span></span></button>`).join('');lucide.createIcons();list.querySelectorAll('.type-btn').forEach(btn=>btn.addEventListener('click',()=>{if(editId)return;selected=btn.dataset.type;drawTypes();drawDetails()}));}
    function drawDetails(){const config=detailConfig[selected];document.querySelector('#detail标题').textContent=config.title;detailFields.innerHTML=config.fields.map(([id,label,type,placeholder])=>{if(type==='select')return `<div class="field"><label for="detail-${id}">${label}</label><select id="detail-${id}"><option value="">请选择</option><option>入门</option><option>中级</option><option>高级</option></select></div>`;return `<div class="field"><label for="detail-${id}">${label}</label><input id="detail-${id}" type="${type}" placeholder="${placeholder}" ${id==='year'?'min="1900" max="2027"':''}/></div>`}).join('');}
    function val(id){return document.querySelector('#detail-'+id)?.value.trim()||''}
    function showStatus(kind,message){const node=document.querySelector('#status');node.className='status '+kind;node.textContent=message;node.scrollIntoView({behavior:'smooth',block:'nearest'});}
    document.querySelector('#resourceForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget, btn=document.querySelector('#submitBtn');if(!form.checkValidity()){form.reportValidity();return}const common={title:document.querySelector('#title').value.trim(),description:document.querySelector('#description').value.trim(),license:document.querySelector('#license').value,research_field:document.querySelector('#research_field').value.trim()||null,tags:document.querySelector('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),repository_url:document.querySelector('#repository_url').value.trim()||null,homepage_url:document.querySelector('#homepage_url').value.trim()||null,thumbnail_url:document.querySelector('#thumbnail_url').value.trim()||null};const values={};detailConfig[selected].fields.forEach(([id])=>{const value=val(id);if(value)values[id]=id==='year'?Number(value):id==='members'||id==='authors'?value.split(',').map(x=>x.trim()).filter(Boolean):value});const payload=editId?{...common,details:{...(editResource?.details||{}),[selected]:values}}:{...common,resource_type:selected,[selected]:values};btn.disabled=true;btn.innerHTML='<i data-lucide="loader-circle" style="width:15px;vertical-align:-3px;margin-right:6px"></i>'+(editId?'正在保存…':'正在发布…');lucide.createIcons();try{const response=await OpenResearchAuth.request(editId?'/api/resources/'+editId:'/api/resources',{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){const detail=Array.isArray(data.detail)?data.detail.map(item=>item.msg).join('；'):data.detail||'保存失败，请检查表单内容';throw new Error(detail)}showStatus('success',editId?'资源已更新，正在打开详情页…':'资源发布成功，正在打开详情页…');setTimeout(()=>{window.location.href='/resources/'+data.id},450)}catch(error){showStatus('error',error.message||'操作失败，请稍后重试');btn.disabled=false;btn.innerHTML='<i data-lucide="send" style="width:15px;vertical-align:-3px;margin-right:6px"></i>'+(editId?'保存修改':'发布资源');lucide.createIcons()}});
    async function initializePublish(){await OpenResearchAuth.init();OpenResearchAuth.mountNav(document.querySelector('[data-auth-nav]'));if(!OpenResearchAuth.isAuthenticated()){document.querySelector('main').innerHTML='<section class="panel auth-guard"><div class="guard-inner"><div class="eyebrow">仅限登录用户</div><h2>登录后才能发布资源。</h2><p>登录后，你发布的每一个科研资源都会自动关联到你的研究者身份。</p><div class="guard-actions"><a class="primary-guard" href="/login?next=%2Fpublish">登录</a><a href="/register">创建账户</a></div></div></section>';return}if(editId){const response=await OpenResearchAuth.request('/api/resources/'+editId);const data=await response.json().catch(()=>({}));if(!response.ok){showStatus('error',data.detail||'无法加载要编辑的资源');return}if(data.author_id!==OpenResearchAuth.currentUser.id){showStatus('error','只有资源作者可以编辑资源');return}editResource=data;selected=data.resource_type;document.querySelector('.eyebrow').textContent='更新开放研究资源';document.querySelector('h1').textContent='编辑资源';document.querySelector('.intro').textContent='更新资源的公开信息与关联链接。资源类型在编辑时保持不变。';document.querySelector('#submitBtn').innerHTML='<i data-lucide="save" style="width:15px;vertical-align:-3px;margin-right:6px"></i>保存修改';document.querySelector('#title').value=data.title;document.querySelector('#description').value=data.description;document.querySelector('#license').value=data.license||'MIT';document.querySelector('#research_field').value=data.research_field||'';document.querySelector('#tags').value=(data.tags||[]).map(tag=>tag.name).join(', ');document.querySelector('#repository_url').value=data.repository_url||'';document.querySelector('#homepage_url').value=data.homepage_url||'';document.querySelector('#thumbnail_url').value=data.thumbnail_url||'';drawTypes();drawDetails();Object.entries(data.details?.[selected]||{}).forEach(([key,value])=>{const node=document.querySelector('#detail-'+key);if(node)node.value=Array.isArray(value)?value.join(', '):value??''});}else{drawTypes();drawDetails()}lucide.createIcons()};initializePublish();
  </script>
</body>
</html>
