name: openresearch
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: &default-logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 6
    logging: *default-logging

  gitea:
    image: gitea/gitea:1.24.6
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:?set GITEA_DOMAIN}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN:?set GITEA_DOMAIN}/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN:?set GITEA_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: 22
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea_data:/data
    networks: [internal]
    expose: ["3000"]
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-openresearch-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: "true"
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: https://${GITEA_DOMAIN:?set GITEA_DOMAIN}
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_DOMAIN: ${GITEA_DOMAIN:?set GITEA_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-openresearch-resources}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-209715200}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_ADMIN_BOOTSTRAP: ${ALLOW_ADMIN_BOOTSTRAP:-false}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?set TRUSTED_HOSTS}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      gitea: { condition: service_healthy }
    networks: [internal, edge]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      GITEA_DOMAIN: ${GITEA_DOMAIN:?set GITEA_DOMAIN}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-209715200}
    depends_on:
      backend: { condition: service_healthy }
      gitea: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks: [edge, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging

  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [certbot]
    ports:
      - "80:80"
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  gitea_data:
