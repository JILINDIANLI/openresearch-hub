  <script>
  (() => {
    const app=document.querySelector('#app');
    const parts=location.pathname.split('/').filter(Boolean);
    const resourceId=parts[1];
    const editRequested=new URLSearchParams(location.search).get('edit')==='1';
    let resource=null,showcase=null;
    const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const request=(...args)=>OpenResearchAuth.request(...args);
    const authorName=()=>resource?.author?.display_name||resource?.author?.username||resource?.author_name||'开放研究中心贡献者';
    const isOwner=()=>Boolean(resource&&OpenResearchAuth.currentUser&&Number(resource.author_id)===Number(OpenResearchAuth.currentUser.id));
    const toast=message=>{const node=document.querySelector('#toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),2300)};
    const formatDate=value=>value?new Date(value).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}):'未填写';
    const typeLabel=()=>{const raw=String(resource?.type||resource?.resource_type||'resource').toLowerCase();return ({model:'模型',dataset:'数据集',algorithm:'算法',project:'项目',paper:'论文',demo:'演示',tutorial:'教程',resource:'科研资源'})[raw]||'科研资源'};
    const links=()=>{const project=resource?.details?.project||{},paper=resource?.details?.paper||{},dataset=resource?.details?.dataset||{},demo=resource?.details?.demo||{},algorithm=resource?.details?.algorithm||{};return {code:resource?.repository_url||project.github_url||algorithm.code_url||'',paper:paper.pdf_url||(paper.doi?'https://doi.org/'+paper.doi:'')||project.paper_url||algorithm.paper_url||'',dataset:dataset.download_url||dataset.dataset_url||'',demo:demo.video_url||demo.project_url||project.demo_url||''}};
    const safeMarkdown=source=>{let text=esc(source||'');const blocks=[];const fence=String.fromCharCode(96).repeat(3);text=text.replace(new RegExp(fence+'[a-zA-Z0-9+_-]*\\n([\\s\\S]*?)'+fence,'g'),(_,code)=>{blocks.push('<pre><code>'+code+'</code></pre>');return '@@BLOCK'+(blocks.length-1)+'@@'});text=text.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');text=text.replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/(?:<li>.*?<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');text=text.replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>');text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,href)=>'<a href="'+href+'" target="_blank" rel="noreferrer noopener">'+label+'</a>');text=text.split(/\n{2,}/).map(part=>/^(<h[1-3]>|<ul>|<pre>|@@BLOCK)/.test(part.trim())?part:'<p>'+part.replace(/\n/g,'<br>')+'</p>').join('');return text.replace(/@@BLOCK(\d+)@@/g,(_,index)=>blocks[Number(index)]||'')};
    const rowsFor=data=>Array.isArray(data)?data:(data&&typeof data==='object'?[data]:[]);
    const resultTable=data=>{const rows=rowsFor(data);if(!rows.length)return '<div class="empty">暂无基准测试数据。</div>';const columns=[...new Set(rows.flatMap(row=>row&&typeof row==='object'?Object.keys(row):[]))];if(!columns.length)return '<pre>'+esc(JSON.stringify(data,null,2))+'</pre>';const numericColumn=columns.find(column=>rows.some(row=>typeof row?.[column]==='number'));const values=numericColumn?rows.map(row=>Number(row[numericColumn])).filter(Number.isFinite):[];const best=values.length?Math.min(...values):null;return '<table><thead><tr>'+columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>{const isBest=numericColumn&&Number(row?.[numericColumn])===best;return '<tr class="'+(isBest?'best':'')+'">'+columns.map((column,index)=>'<td>'+esc(typeof row?.[column]==='object'?JSON.stringify(row[column]):row?.[column]??'')+(isBest&&index===0?'<span class="best-mark">最佳</span>':'')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>'};
    const parseLines=(source,fallback)=>{const lines=String(source||'').split(/\n+/).map(line=>line.replace(/^\s*(?:[-*]|\d+[.)])\s*/,'').replace(/^#+\s*/,'').trim()).filter(Boolean);return (lines.length?lines:fallback).slice(0,4)};
    const methodologySteps=()=>parseLines(showcase?.methodology,['初始化','探索','开发','评估']);
    const contributionCards=()=>parseLines(showcase?.contributions,['自适应搜索策略','混合变异机制','增强开发能力']);
    const overviewText=kind=>kind==='abstract'?(showcase?.abstract||resource?.description||'暂无摘要。'):kind==='background'?(showcase?.research_background||'项目团队将补充研究背景。'):(showcase?.short_description||'通过开放研究中心共享的可复现科研项目。');
    const coverMarkup=()=>{const image=resource?.thumbnail_url||(showcase?.media||[]).find(item=>item.media_type==='IMAGE')?.preview_url;return image?'<img class="cover-media" src="'+esc(image)+'" alt="'+esc(showcase?.title||resource?.title||'研究封面')+'">':'<div class="cover-placeholder"><span>科研项目展示</span></div>'};
    const heroMarkup=()=>{const related=links();const tags=resource?.tags||[];const file=resource?.files?.[0];const download=file?.download_url||file?.url||resource?.download_url||('/resources/'+resource.id+'#files');const hasFile=Boolean(file?.download_url||file?.url||resource?.download_url);return '<section class="hero"><div class="hero-grid"><div><div class="hero-label"><i data-lucide="flask-conical"></i><span>'+esc(typeLabel())+'</span>'+tags.map(tag=>'<span class="badge">'+esc(tag.name)+'</span>').join('')+'</div><h1>'+esc(showcase?.title||resource?.title||'科研项目')+'</h1><p class="hero-intro">'+esc(showcase?.short_description||resource?.description||'面向开放研究社区共享的科研项目。')+'</p><div class="hero-meta"><span><i data-lucide="user-round"></i>创建者：'+esc(authorName())+'</span><span><i data-lucide="calendar-days"></i>更新于：'+esc(formatDate(showcase?.updated_at||resource?.updated_time))+'</span><span><i data-lucide="git-branch"></i>版本：'+esc(resource?.latest_version||'v1.0')+'</span></div><div class="hero-actions"><a class="button" href="/resources/'+resource.id+'"><i data-lucide="arrow-up-right"></i>查看资源</a>'+(related.code?'<a class="button ghost" href="'+esc(related.code)+'" target="_blank" rel="noreferrer"><i data-lucide="code-2"></i>代码</a>':'')+(related.paper?'<a class="button ghost" href="'+esc(related.paper)+'" target="_blank" rel="noreferrer"><i data-lucide="file-text"></i>论文</a>':'')+'<a class="button ghost" href="'+esc(download)+'" '+(hasFile?'target="_blank" rel="noreferrer" download':'')+'><i data-lucide="download"></i>下载</a>'+(related.dataset?'<a class="button ghost" href="'+esc(related.dataset)+'" target="_blank" rel="noreferrer"><i data-lucide="database"></i>数据集</a>':'')+(isOwner()?'<button class="button ghost" type="button" data-edit-showcase><i data-lucide="pencil"></i>编辑</button>':'')+'</div></div><div class="hero-side"><span class="hero-side-label">研究领域</span><strong>'+esc(resource?.research_field||'开放研究')+'</strong><p>'+esc(resource?.visibility||'public')+' · '+esc(resource?.license||'许可证待补充')+'</p></div></div></section><div class="cover">'+coverMarkup()+'</div>'};
    const tocMarkup=()=>'<nav class="toc" aria-label="研究章节"><div class="toc-inner">'+[['overview','研究概览'],['methodology','研究方法'],['contributions','核心贡献'],['experiments','实验'],['results','结果'],['media','媒体'],['citation','引用']].map(item=>'<a href="#'+item[0]+'" data-toc="'+item[0]+'">'+item[1]+'</a>').join('')+'</div></nav>';
    const overviewMarkup=()=>'<section class="content-section" id="overview"><div class="section-kicker">研究概览</div><h2>项目价值所在</h2><div class="overview-grid"><article class="overview-card"><h3>摘要</h3><div class="markdown">'+safeMarkdown(overviewText('abstract'))+'</div></article><article class="overview-card"><h3>研究背景</h3><div class="markdown">'+safeMarkdown(overviewText('background'))+'</div></article><article class="overview-card"><h3>研究目标</h3><div class="markdown">'+safeMarkdown(overviewText('goal'))+'</div></article></div></section>';
    const methodologyMarkup=()=>{const steps=methodologySteps();return '<section class="content-section" id="methodology"><div class="section-kicker">研究方法</div><h2>从初始化到评估</h2><div class="step-flow">'+steps.map((step,index)=>'<article class="step"><span class="step-num">0'+(index+1)+'</span><h3>'+esc(step)+'</h3><p>'+esc(index===0?'设定搜索空间与实验配置。':index===1?'在全局空间中探索候选方案。':index===2?'通过聚焦的局部搜索优化有前景的候选方案。':'衡量性能并记录可复现实证。')+'</p></article>').join('')+'</div>'+(showcase?.methodology?'<div class="markdown" style="margin-top:21px">'+safeMarkdown(showcase.methodology)+'</div>':'')+'</section>'};
    const contributionsMarkup=()=>{const cards=contributionCards();return '<section class="content-section" id="contributions"><div class="section-kicker">核心贡献</div><h2>这项工作的新意</h2><div class="innovation-grid">'+cards.slice(0,3).map((item,index)=>'<article class="innovation"><i data-lucide="'+(['sparkles','sliders-horizontal','target'][index]||'lightbulb')+'"></i><h3>'+esc(item)+'</h3><p>旨在让研究流程更清晰、更稳定、更易复现。</p></article>').join('')+'</div>'+(showcase?.contributions?'<div class="markdown" style="margin-top:21px">'+safeMarkdown(showcase.contributions)+'</div>':'')+'</section>'};
    const experimentsMarkup=()=>'<section class="content-section" id="experiments"><div class="section-kicker">实验</div><h2>评估方案</h2><div class="markdown">'+safeMarkdown(showcase?.experiments||'实验与评估细节将在下一次项目更新时发布。')+'</div></section>';
    const resultsMarkup=()=>{const results=showcase?.results||[];if(!results.length)return '<section class="content-section" id="results"><div class="section-kicker">结果</div><h2>性能证据</h2><div class="empty">项目团队发布后，基准测试结果将显示在这里。</div></section>';const first=rowsFor(results[0].table_data),numeric=first.length?Object.keys(first[0]||{}).find(k=>first.some(row=>typeof row?.[k]==='number')):'';const best=numeric?Math.min(...first.map(row=>Number(row[numeric])).filter(Number.isFinite)):null;const stability=first.find(row=>row.stability)?.stability||'—';return '<section class="content-section" id="results"><div class="section-kicker">结果</div><h2>性能证据</h2><div class="summary-grid"><div class="metric"><span class="metric-label">最佳 '+esc(numeric||'得分')+'</span><span class="metric-value">'+esc(best===null?'—':best)+'</span><span class="metric-note">最佳已报告基准</span></div><div class="metric"><span class="metric-label">稳定性</span><span class="metric-value">'+esc(stability)+'</span><span class="metric-note">跨多次重复试验</span></div><div class="metric"><span class="metric-label">证据集合</span><span class="metric-value">'+esc(results.length)+'</span><span class="metric-note">已发布结果表</span></div></div><div class="result-list">'+results.map(result=>'<article class="result"><div class="result-head"><div><h3>'+esc(result.title)+'</h3>'+(result.description?'<p>'+esc(result.description)+'</p>':'')+'</div><i data-lucide="table-2"></i></div>'+resultTable(result.table_data)+'</article>').join('')+'</div>'+(showcase?.results_summary?'<div class="markdown" style="margin-top:19px">'+safeMarkdown(showcase.results_summary)+'</div>':'')+'</section>'};
    const mediaMarkup=()=>{const media=showcase?.media||[];return '<section class="content-section" id="media"><div class="section-kicker">可视化</div><h2>图表、仿真与媒体资料</h2>'+(media.length?'<div class="gallery">'+media.map(item=>{const title=item.title||item.filename||'研究媒体';if(item.media_type==='IMAGE')return '<article class="media"><button type="button" class="media-image" data-image="'+esc(item.preview_url)+'" data-image-title="'+esc(title)+'"><img class="media-preview" src="'+esc(item.preview_url)+'" alt="'+esc(title)+'"></button><div class="media-copy"><b>'+esc(title)+'</b><span>'+esc(item.description||item.filename||'Image')+'</span></div></article>';if(item.media_type==='VIDEO')return '<article class="media"><video controls preload="metadata" src="'+esc(item.preview_url)+'"></video><div class="media-copy"><b>'+esc(title)+'</b><span>'+esc(item.description||item.filename||'Video')+'</span></div></article>';return '<article class="media"><a class="media-preview pdf-preview" href="'+esc(item.preview_url||item.download_url)+'" target="_blank" rel="noreferrer"><i data-lucide="file-text"></i><span>打开文档</span></a><div class="media-copy"><b>'+esc(title)+'</b><span>'+esc(item.description||item.filename||'Document')+'</span></div></article>'}).join('')+'</div>':'<div class="empty">可在科研展示编辑器中添加框架图、收敛曲线、对比图或仿真视频。</div>')+'</section>'};
    const citationMarkup=()=>{const doi=resource?.details?.paper?.doi||resource?.doi||'';if(!showcase?.citation_text&&!showcase?.bibtex&&!doi)return '';return '<section class="content-section" id="citation"><div class="section-kicker">引用</div><h2>引用此项研究</h2><div class="citation-block">'+(showcase.citation_text?'<article class="citation"><div class="citation-toolbar"><div><strong>普通引用格式</strong><span>适用于报告、幻灯片和项目页面</span></div></div><div class="markdown">'+safeMarkdown(showcase.citation_text)+'</div></article>':'')+(showcase.bibtex?'<article class="citation"><div class="citation-toolbar"><div><strong>BibTeX</strong><span>可直接用于文献管理工具</span></div><button type="button" class="copy-button" data-copy-bibtex><i data-lucide="copy"></i>复制</button></div><pre>'+esc(showcase.bibtex)+'</pre></article>':'')+(doi?'<article class="citation"><div class="citation-toolbar"><div><strong>DOI</strong><span>永久标识符</span></div><a class="copy-button" href="https://doi.org/'+esc(doi)+'" target="_blank" rel="noreferrer"><i data-lucide="external-link"></i>打开 DOI</a></div><pre>'+esc(doi)+'</pre></article>':'')+'</div></section>'};
    const sidebarMarkup=()=>{const related=links();return '<aside class="sidebar"><section class="info-card"><h3>研究信息</h3><dl><div class="info-row"><dt>作者</dt><dd>'+esc(authorName())+'</dd></div><div class="info-row"><dt>类型</dt><dd>'+esc(typeLabel())+'</dd></div><div class="info-row"><dt>领域</dt><dd>'+esc(resource?.research_field||'未填写')+'</dd></div><div class="info-row"><dt>许可证</dt><dd>'+esc(resource?.license||'未填写')+'</dd></div><div class="info-row"><dt>版本</dt><dd>'+esc(resource?.latest_version||'v1.0')+'</dd></div><div class="info-row"><dt>创建时间</dt><dd>'+esc(formatDate(resource?.created_time||resource?.created_at))+'</dd></div><div class="info-row"><dt>更新时间</dt><dd>'+esc(formatDate(resource?.updated_time||resource?.updated_at))+'</dd></div></dl></section><section class="info-card"><h3>相关链接</h3><div class="info-links"><a href="/resources/'+resource.id+'"><i data-lucide="box"></i>资源概览</a>'+(related.code?'<a href="'+esc(related.code)+'" target="_blank" rel="noreferrer"><i data-lucide="code-2"></i>代码仓库</a>':'')+(related.paper?'<a href="'+esc(related.paper)+'" target="_blank" rel="noreferrer"><i data-lucide="file-text"></i>论文</a>':'')+(related.dataset?'<a href="'+esc(related.dataset)+'" target="_blank" rel="noreferrer"><i data-lucide="database"></i>数据集</a>':'')+(related.demo?'<a href="'+esc(related.demo)+'" target="_blank" rel="noreferrer"><i data-lucide="play-circle"></i>演示</a>':'')+'</div></section><section class="info-card"><h3>资源动态</h3><div class="stats"><div class="stat"><b>'+esc(resource?.stars_count??resource?.stars??0)+'</b><span>收藏</span></div><div class="stat"><b>'+esc(resource?.downloads_count??resource?.downloads??0)+'</b><span>下载量</span></div><div class="stat"><b>'+esc(resource?.views_count??resource?.views??0)+'</b><span>浏览量</span></div></div></section></aside>'};
    const field=(name,label,value='',extra='')=>'<div class="form-field '+extra+'"><label for="showcase-'+name+'">'+label+'</label>'+((name==='title'||name==='short_description')?'<input id="showcase-'+name+'" name="'+name+'" value="'+esc(value)+'" '+(name==='title'?'required minlength="3"':'')+'>':'<textarea id="showcase-'+name+'" name="'+name+'">'+esc(value)+'</textarea>')+'</div>';
    const manageMarkup=()=>{const media=showcase.media||[],results=showcase.results||[];return '<div class="manage-grid"><section class="manage-block"><h3>科研展示媒体</h3><p>添加存储在 MinIO 中的图片、MP4/WebM 视频或 PDF 文件。</p><form id="mediaForm" class="upload-form"><input name="file" type="file" required accept="image/png,image/jpeg,image/webp,video/mp4,video/webm,application/pdf"><input name="title" type="text" maxlength="255" placeholder="媒体标题"><input name="order_index" type="number" min="0" value="0" title="展示顺序"><button class="button dark" type="submit">上传</button></form><div>'+(media.map(item=>'<div class="admin-row"><div><b>'+esc(item.title||item.filename)+'</b><span>'+esc(item.media_type)+' · '+esc(item.filename)+'</span></div><button class="icon-button" type="button" title="删除媒体" data-delete-media="'+item.id+'"><i data-lucide="trash-2"></i></button></div>').join('')||'<p class="empty">暂未添加科研展示媒体。</p>')+'</div></section><section class="manage-block"><h3>结果表</h3><p>请输入一个 JSON 对象或 JSON 记录数组。</p><form id="resultForm" class="result-form"><input name="title" required maxlength="255" placeholder="结果表标题"><input name="description" maxlength="5000" placeholder="此结果说明什么？"><textarea name="table_data" required placeholder=\'[{"algorithm":"EBKA","cost":100,"stability":"High"}]\'></textarea><button class="button dark" type="submit">添加结果</button></form><div>'+(results.map(item=>'<div class="admin-row"><div><b>'+esc(item.title)+'</b><span>'+esc(item.description||'结果表')+'</span></div><button class="icon-button" type="button" title="删除结果" data-delete-result="'+item.id+'"><i data-lucide="trash-2"></i></button></div>').join('')||'<p class="empty">暂未添加结果表。</p>')+'</div></section></div>'};
    const editorMarkup=()=>{const value=showcase||{};return '<section class="editor"><h2>'+(showcase?'编辑科研展示':'创建科研展示')+'</h2><p>文本字段支持安全的 Markdown：标题、列表、代码块和 HTTPS 链接。</p><form id="showcaseForm"><div class="form-grid">'+field('title','标题',value.title,'wide')+field('short_description','简短说明',value.short_description,'wide')+field('abstract','摘要',value.abstract,'wide')+field('research_background','研究背景',value.research_background,'wide')+field('methodology','研究方法',value.methodology,'wide')+field('contributions','核心贡献',value.contributions,'wide')+field('experiments','实验',value.experiments,'wide')+field('results_summary','结果摘要',value.results_summary,'wide')+field('citation_text','普通文本引用',value.citation_text,'wide')+field('bibtex','BibTeX',value.bibtex,'wide')+'</div><div class="editor-actions">'+(showcase?'<button class="button danger" type="button" data-delete-showcase><i data-lucide="trash-2"></i>删除</button>':'')+'<a class="button light" href="/resources/'+resource.id+'/showcase">取消</a><button class="button dark" type="submit"><i data-lucide="save"></i>'+(showcase?'保存修改':'创建科研展示')+'</button></div></form>'+(showcase?manageMarkup():'')+'</section>'};
    const storyMarkup=()=>'<div class="crumb"><a href="/">浏览</a><i data-lucide="chevron-right"></i><a href="/resources/'+resource.id+'">'+esc(resource.title)+'</a><i data-lucide="chevron-right"></i><span>科研展示</span></div>'+heroMarkup()+tocMarkup()+'<div class="layout"><article>'+overviewMarkup()+methodologyMarkup()+contributionsMarkup()+experimentsMarkup()+resultsMarkup()+mediaMarkup()+citationMarkup()+'</article>'+sidebarMarkup()+'</div>'+(editRequested&&isOwner()?editorMarkup():'');
    const emptyMarkup=()=>'<div class="crumb"><a href="/">浏览</a><i data-lucide="chevron-right"></i><a href="/resources/'+resource.id+'">'+esc(resource.title)+'</a><i data-lucide="chevron-right"></i><span>科研展示</span></div><section class="hero"><div class="hero-grid"><div><div class="hero-label"><i data-lucide="flask-conical"></i>科研展示</div><h1>尚未发布科研展示</h1><p class="hero-intro">此资源已具备创建科研项目页面的条件。准备分享时，可补充研究背景、证据与媒体资料。</p><div class="hero-actions"><a class="button" href="/resources/'+resource.id+'"><i data-lucide="arrow-left"></i>查看资源</a>'+(isOwner()?'<button class="button ghost" type="button" data-new-showcase><i data-lucide="plus"></i>创建科研展示</button>':'')+'</div></div></div></section>'+(editRequested&&isOwner()?editorMarkup():'');
    function bindStory(){document.querySelector('[data-edit-showcase]')?.addEventListener('click',()=>{history.replaceState({},'', '/resources/'+resource.id+'/showcase?edit=1');render()});document.querySelector('[data-copy-bibtex]')?.addEventListener('click',async event=>{try{await navigator.clipboard.writeText(showcase.bibtex);event.currentTarget.classList.add('copied');event.currentTarget.innerHTML='<i data-lucide="check"></i>已复制';window.lucide?.createIcons();toast('BibTeX 已复制');setTimeout(()=>{event.currentTarget.classList.remove('copied');event.currentTarget.innerHTML='<i data-lucide="copy"></i>复制';window.lucide?.createIcons()},1800)}catch(_){toast('当前浏览器不支持复制功能')}});document.querySelectorAll('[data-image]').forEach(button=>button.addEventListener('click',()=>{const dialog=document.querySelector('#lightbox');document.querySelector('#lightboxImage').src=button.dataset.image;document.querySelector('#lightboxImage').alt=button.dataset.imageTitle||'研究媒体';dialog.showModal()}));const sections=[...document.querySelectorAll('.content-section')],toc=[...document.querySelectorAll('[data-toc]')];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)toc.forEach(link=>link.classList.toggle('active',link.dataset.toc===entry.target.id))}),{rootMargin:'-150px 0px -60% 0px',threshold:0});sections.forEach(section=>observer.observe(section))};
    function bindEditor(){const form=document.querySelector('#showcaseForm');if(!form)return;form.addEventListener('submit',async event=>{event.preventDefault();const payload=Object.fromEntries(new FormData(form));const response=await request('/api/resources/'+resource.id+'/showcase',{method:showcase?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){toast(data.detail||'无法保存科研展示。');return}showcase=data;history.replaceState({},'', '/resources/'+resource.id+'/showcase');toast('科研展示已保存。');render()});document.querySelector('[data-delete-showcase]')?.addEventListener('click',async()=>{if(!confirm('确定删除此科研展示及其媒体资料吗？资源本身不会被删除。'))return;const response=await request('/api/resources/'+resource.id+'/showcase',{method:'DELETE'});if(response.status!==204){const data=await response.json().catch(()=>({}));toast(data.detail||'无法删除科研展示。');return}showcase=null;toast('科研展示已删除。');render()});document.querySelector('#mediaForm')?.addEventListener('submit',async event=>{event.preventDefault();const response=await request('/api/showcases/'+showcase.id+'/media',{method:'POST',body:new FormData(event.currentTarget)});const data=await response.json().catch(()=>({}));if(!response.ok){toast(data.detail||'上传失败。');return}showcase.media.push(data);event.currentTarget.reset();toast('媒体已上传。');render()});document.querySelectorAll('[data-delete-media]').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('确定删除此科研展示媒体吗？'))return;const response=await request('/api/showcases/media/'+button.dataset.deleteMedia,{method:'DELETE'});if(response.status!==204){const data=await response.json().catch(()=>({}));toast(data.detail||'无法删除媒体。');return}showcase.media=showcase.media.filter(item=>String(item.id)!==button.dataset.deleteMedia);render()}));document.querySelector('#resultForm')?.addEventListener('submit',async event=>{event.preventDefault();const dataForm=new FormData(event.currentTarget);let table_data;try{table_data=JSON.parse(dataForm.get('table_data'))}catch(_){toast('结果表 JSON 格式无效。');return}const response=await request('/api/showcases/'+showcase.id+'/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:dataForm.get('title'),description:dataForm.get('description'),table_data})});const data=await response.json().catch(()=>({}));if(!response.ok){toast(data.detail||'无法添加结果。');return}showcase.results.push(data);event.currentTarget.reset();toast('结果已添加。');render()});document.querySelectorAll('[data-delete-result]').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('确定删除此结果表吗？'))return;const response=await request('/api/showcase/results/'+button.dataset.deleteResult,{method:'DELETE'});if(response.status!==204){const data=await response.json().catch(()=>({}));toast(data.detail||'无法删除结果。');return}showcase.results=showcase.results.filter(item=>String(item.id)!==button.dataset.deleteResult);render()}))};
    function render(){document.querySelector('#resourceLink').href='/resources/'+resource.id;app.innerHTML=showcase?storyMarkup():emptyMarkup();if(!showcase&&editRequested&&isOwner())document.querySelector('[data-new-showcase]')?.addEventListener('click',()=>{history.replaceState({},'', '/resources/'+resource.id+'/showcase?edit=1');render()});if(showcase)bindStory();if(editRequested&&isOwner())bindEditor();window.lucide?.createIcons()};
    async function init(){await OpenResearchAuth.init();OpenResearchAuth.mountNav(document.querySelector('[data-auth-nav]'));const resourceResponse=await request('/api/resources/'+encodeURIComponent(resourceId));if(!resourceResponse.ok)throw new Error((await resourceResponse.json().catch(()=>({}))).detail||'资源不可用。');resource=await resourceResponse.json();const filesResponse=await request('/api/resources/'+encodeURIComponent(resourceId)+'/files');if(filesResponse.ok)resource.files=await filesResponse.json();const showcaseResponse=await request('/api/resources/'+encodeURIComponent(resourceId)+'/showcase');if(showcaseResponse.ok)showcase=await showcaseResponse.json();else if(showcaseResponse.status!==404)throw new Error((await showcaseResponse.json().catch(()=>({}))).detail||'无法加载科研展示。');document.title=(showcase?.title||resource.title)+' · 科研展示';render()};
    document.querySelector('[data-close-lightbox]').addEventListener('click',()=>document.querySelector('#lightbox').close());
    init().catch(error=>{app.innerHTML='<div class="error">'+esc(error.message)+'</div>'});
  })();
  </script>
</body>
