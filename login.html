<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>登录 · 开放研究中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17202a;--muted:#72808c;--line:#dfe6eb;--paper:#f6f8fa;--blue:#246bfd;--red:#b13d48}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#eff5ff 0%,#f7f9fb 45%,#eff9f6 100%);font-family:"DM Sans",sans-serif;color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,520px)}.story{padding:clamp(30px,7vw,112px);display:flex;flex-direction:column;justify-content:space-between;background-image:linear-gradient(#dce7f055 1px,transparent 1px),linear-gradient(90deg,#dce7f055 1px,transparent 1px);background-size:48px 48px}.brand{display:flex;gap:10px;align-items:center;font:800 20px Manrope,sans-serif;text-decoration:none;color:var(--ink)}.mark{width:29px;height:29px;border-radius:8px;background:#17202a;display:grid;place-items:center;position:relative}.mark i{position:absolute;width:5px;height:15px;border-radius:4px;background:#80e9c1;transform:rotate(25deg)}.mark i:nth-child(2){background:#9abaff;transform:translateX(6px) rotate(25deg)}.mark i:nth-child(3){background:#f5c76d;transform:translateX(-6px) rotate(25deg)}.story-copy{max-width:590px;margin:auto 0}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.story h1{font:800 clamp(40px,5vw,66px)/1.05 Manrope,sans-serif;letter-spacing:-.055em;margin:14px 0 19px}.story p{max-width:485px;color:#60707d;font-size:16px;line-height:1.75}.statline{display:flex;gap:30px;margin-top:38px}.statline strong{display:block;font:800 24px Manrope,sans-serif}.statline span{color:#7f8d99;font-size:12px}.form-side{display:grid;place-items:center;background:#fff;padding:30px}.form-wrap{width:min(100%,370px)}.back{display:inline-flex;color:#63717e;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:37px}.form-wrap h2{font:800 31px Manrope,sans-serif;letter-spacing:-.04em;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 27px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.field label{font-size:12px;font-weight:800;color:#3f4e5b}.field input{height:45px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;outline:none}.field input:focus{border-color:#78a2ff;box-shadow:0 0 0 4px #e8f0ff}.notice{display:none;padding:10px 12px;border-radius:8px;margin:0 0 17px;font-size:13px;line-height:1.45}.notice.show{display:block}.notice.error{color:#9d3342;background:#fff0f1;border:1px solid #f3c6cb}.notice.info{color:#225bbd;background:#edf4ff;border:1px solid #cbdcff}button{height:46px;width:100%;border:0;border-radius:8px;background:#17202a;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.58;cursor:wait}.foot{margin:21px 0 0;text-align:center;color:#7b8894;font-size:13px}.foot a{color:var(--blue);font-weight:800;text-decoration:none}@media(max-width:800px){body{grid-template-columns:1fr}.story{display:none}.form-side{min-height:100vh;padding:24px}.form-wrap{width:min(100%,430px)}}
  </style>
  <script src="/auth.js"></script>
</head>
<body>
  <section class="story"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span>开放研究中心</a><div class="story-copy"><div class="eyebrow">开放科学，共享连接</div><h1>让重要的研究持续生长。</h1><p>登录后发布研究资源、维护自己的项目，并让每一份成果都有清晰可信的作者归属。</p><div class="statline"><div><strong>28+</strong><span>研究资源</span></div><div><strong>7</strong><span>资源类型</span></div></div></div><span></span></section>
  <main class="form-side"><section class="form-wrap"><a class="back" href="/">← 返回开放研究中心</a><h2>欢迎回来</h2><p class="sub">使用用户名或邮箱登录你的研究者账户。</p><div id="notice" class="notice"></div><form id="loginForm"><div class="field"><label for="identifier">用户名或邮箱</label><input id="identifier" autocomplete="username" required placeholder="例如：kai-shen 或 you@lab.edu"></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></div><button id="submit" type="submit">登录</button></form><p class="foot">还没有账户？ <a href="/register">创建账户</a></p></section></main>
  <script>
    const params=new URLSearchParams(location.search),notice=document.querySelector('#notice');function show(message,kind='error'){notice.className='notice show '+kind;notice.textContent=message}if(params.get('notice'))show(params.get('notice'),'info');document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const btn=document.querySelector('#submit');btn.disabled=true;btn.textContent='正在登录…';try{await OpenResearchAuth.login(document.querySelector('#identifier').value.trim(),document.querySelector('#password').value);location.href=params.get('next')||'/'}catch(error){show(error.message);btn.disabled=false;btn.textContent='登录'}});OpenResearchAuth.init().then(()=>{if(OpenResearchAuth.isAuthenticated())location.href='/'})
  </script>
</body>
</html>
