<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/auth.js"></script>
  <script src="/community-ui.js"></script>
  <title>问题详情 · 开放研究中心</title>
  <style>
    :root{--ink:#17212b;--muted:#71808d;--line:#e3e9ee;--soft:#f6f8fa;--blue:#2563eb;--green:#087443;--amber:#986501;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,5vw)}.brand{font-weight:850;letter-spacing:-.02em;color:var(--ink)}.wrap{max-width:1060px;margin:34px auto;padding:0 20px}.back{display:inline-flex;gap:7px;align-items:center;color:#61707d;font-size:13px;margin-bottom:16px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:18px;box-shadow:0 5px 18px rgba(28,44,58,.035)}
    h1{font-size:30px;line-height:1.2;letter-spacing:-.025em;margin:12px 0 10px}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 8px}.meta{color:var(--muted);font-size:12px;line-height:1.6}.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;background:#edf1f4;color:#53636f}.badge.open{background:#e8f7ef;color:var(--green)}.badge.in_progress{background:#eaf1ff;color:#2354b9}.badge.resolved{background:#e9f8f3;color:#047151}.badge.closed{background:#f0f2f4;color:#5b6874}.badge.high,.badge.critical{background:#fff0ed;color:#ae3c21}.badge.medium{background:#fff8df;color:var(--amber)}.badge.low{background:#edf6ff;color:#2563a8}.markdown{line-height:1.8;color:#334250;margin-top:20px;overflow-wrap:anywhere}.markdown p{margin:0 0 10px}.markdown h1,.markdown h2,.markdown h3{margin:18px 0 8px}.markdown pre{background:#101821;color:#e5edf5;padding:14px;border-radius:8px;overflow:auto}.markdown code{background:#eef2f5;border-radius:4px;padding:2px 5px;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.markdown pre code{background:transparent;padding:0}.markdown a{word-break:break-word}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.btn{border:1px solid #cdd7df;border-radius:7px;padding:9px 12px;background:#fff;color:#2c3a46;font-weight:750;cursor:pointer}.btn:hover{border-color:#9eb2c0;background:#f7fafc}.btn.primary{background:#17212b;color:#fff;border-color:#17212b}.btn:disabled{opacity:.55;cursor:wait}.side-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f3;padding:11px 0;font-size:13px}.side-row:last-child{border:0}.side-row span{color:var(--muted)}.side-row strong{text-align:right;overflow-wrap:anywhere}.manager{display:grid;gap:10px;margin-top:15px}.manager label,.editor label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#52616d}.manager select,.editor input,.editor textarea,.comment-form textarea{width:100%;border:1px solid #ccd6de;border-radius:7px;padding:10px;font:inherit;resize:vertical}.manager .form-row,.editor-actions{display:flex;gap:8px;align-items:center}.editor{display:grid;gap:10px;margin-top:17px;padding-top:18px;border-top:1px solid #edf1f3}.editor textarea{min-height:145px}.comment{border-top:1px solid #edf1f3;padding:18px 0 4px}.comment:first-of-type{border-top:0;padding-top:0}.comment-body{margin-top:9px}.comment-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.comment-meta strong{font-size:13px}.comment-meta time{font-size:11px;color:var(--muted)}.comment-actions{display:flex;gap:6px;margin-top:10px}.comment-actions button{border:0;background:transparent;color:#557080;padding:4px 0;margin-right:12px;font-size:12px;cursor:pointer}.comment-actions button:hover{color:var(--blue)}.comment-replies{margin-left:28px;border-left:2px solid #eef2f5;padding-left:17px}.deleted{color:#8b98a3;font-style:italic}.comment-form{border-top:1px solid #edf1f3;margin-top:18px;padding-top:18px}.comment-form textarea{min-height:105px}.hint{color:var(--muted);font-size:12px}.timeline{position:relative;margin:4px 0}.timeline-item{position:relative;padding:0 0 17px 18px;border-left:2px solid #e7edf1;color:#53636f;font-size:12px;line-height:1.6}.timeline-item:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#3671d6;left:-5px;top:4px}.timeline-item:last-child{padding-bottom:0}.empty{padding:24px 0;color:var(--muted)}.error{color:var(--red);font-size:13px;margin-top:10px}.loading{color:var(--muted);padding:42px 0;text-align:center}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{margin-top:22px;padding:0 14px}.card{padding:18px}h1{font-size:25px}.top{padding:0 14px}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">开放研究中心</a><span data-auth-nav></span></header>
  <main class="wrap" id="app"><div class="loading">正在加载问题…</div></main>
  <script>
  (() => {
    const id = Number(location.pathname.split('/').filter(Boolean).pop());
    const app = document.querySelector('#app');
    const esc = OpenResearchCommunity.escapeHtml;
    let issue = null;
    const currentId = () => OpenResearchAuth.currentUser?.id;
    const formatTime = value => value ? new Date(value).toLocaleString('zh-CN') : '—';
    const authorName = author => esc(author?.display_name || author?.username || '已删除用户');
    const label = value => ({OPEN:'开放',IN_PROGRESS:'处理中',RESOLVED:'已解决',CLOSED:'已关闭',BUG:'缺陷',DOCUMENTATION:'文档',DATASET:'数据集',MODEL:'模型',REPRODUCTION:'复现',FEATURE_REQUEST:'功能请求',QUESTION:'提问',OTHER:'其他',LOW:'低',MEDIUM:'中',HIGH:'高',CRITICAL:'紧急'})[String(value||'').toUpperCase()] || String(value||'').replaceAll('_', ' ');
    function badge(value) { return `<span class="badge ${String(value).toLowerCase()}">${esc(label(value))}</span>`; }
    function commentMarkup(comment, canReply) { const mine=currentId()===comment.author?.id, deleted=comment.is_deleted; const body=deleted?'<div class="deleted">[已删除]</div>':`<div class="markdown">${OpenResearchCommunity.renderMarkdown(comment.content)}</div>`; const controls=!deleted?`<div class="comment-actions">${canReply?`<button type="button" data-reply="${comment.id}">回复</button>`:''}${mine?`<button type="button" data-edit-comment="${comment.id}">编辑</button><button type="button" data-delete-comment="${comment.id}">删除</button>`:''}</div>`:''; const replies=comment.replies?.length?`<div class="comment-replies">${comment.replies.map(item=>commentMarkup(item,false)).join('')}</div>`:''; return `<article class="comment" data-comment="${comment.id}"><div class="comment-meta"><strong>${authorName(comment.author)}</strong><time>${formatTime(comment.created_at)}</time>${comment.updated_at!==comment.created_at?'<span class="hint">已编辑</span>':''}</div><div class="comment-body">${body}</div>${controls}<div class="inline-editor" data-comment-editor="${comment.id}"></div>${replies}</article>`; }
    function timeline() { const entries=[`问题由 ${authorName(issue.author)} 创建 · ${formatTime(issue.created_at)}`]; if(issue.updated_at!==issue.created_at) entries.push(`最近更新 · ${formatTime(issue.updated_at)}`); if(issue.closed_at) entries.push(`${issue.status==='RESOLVED'?'标记为已解决':'已关闭'} · ${formatTime(issue.closed_at)}`); return entries.map(item=>`<div class="timeline-item">${item}</div>`).join(''); }
    function render() {
      const resourceOwner=issue.resource?.author_id===currentId(), author=issue.author?.id===currentId(); const canComment=OpenResearchAuth.isAuthenticated() && !['RESOLVED','CLOSED'].includes(issue.status); const comments=issue.comments?.length?issue.comments.map(item=>commentMarkup(item,canComment)).join(''):'<div class="empty">还没有评论。</div>';
      app.innerHTML=`<a class="back" href="/resources/${issue.resource.id}">← 返回 ${esc(issue.resource.title)}</a><div class="grid"><div><section class="card"><div class="badges">${badge(issue.status)}${badge(issue.issue_type)}${badge(issue.priority)}</div><h1>#${issue.id} ${esc(issue.title)}</h1><div class="meta">由 <a href="/users/${encodeURIComponent(issue.author.username)}">${authorName(issue.author)}</a> 创建 · ${formatTime(issue.created_at)}</div><div class="markdown">${OpenResearchCommunity.renderMarkdown(issue.description)}</div><div class="actions" data-actions></div><div class="inline-editor" id="issue-editor"></div></section><section class="card"><h2>评论 <span class="hint">${issue.comments_count}</span></h2><div id="comments">${comments}</div>${canComment?`<form class="comment-form" id="comment-form"><textarea name="content" required maxlength="10000" placeholder="用 Markdown 写下你的评论..."></textarea><div class="editor-actions" style="margin-top:8px"><button class="btn primary" type="submit">发表评论</button><span class="hint">支持一级评论和回复</span></div><div class="error"></div></form>`:OpenResearchAuth.isAuthenticated()?'<div class="empty">该问题已解决或关闭，暂时不能继续评论。</div>':'<div class="empty">登录后可以参与讨论。</div>'}</section></div><aside><section class="card"><h3>问题信息</h3><div class="side-row"><span>状态</span><strong>${esc(label(issue.status))}</strong></div><div class="side-row"><span>类型</span><strong>${esc(label(issue.issue_type))}</strong></div><div class="side-row"><span>优先级</span><strong>${esc(label(issue.priority))}</strong></div><div class="side-row"><span>负责人</span><strong>${issue.assignee?authorName(issue.assignee):'未指派'}</strong></div><div class="side-row"><span>资源</span><strong><a href="/resources/${issue.resource.id}">${esc(issue.resource.title)}</a></strong></div></section>${resourceOwner?managerMarkup():''}<section class="card"><h3>时间线</h3><div class="timeline">${timeline()}</div></section></aside></div>`;
      const actions=app.querySelector('[data-actions]'); if(author)actions.insertAdjacentHTML('beforeend','<button class="btn" type="button" data-edit-issue>编辑问题</button>'); if(author&&issue.status!=='CLOSED')actions.insertAdjacentHTML('beforeend','<button class="btn" type="button" data-close-own>关闭问题</button>');
      app.querySelector('[data-edit-issue]')?.addEventListener('click',showIssueEditor); app.querySelector('[data-close-own]')?.addEventListener('click',()=>updateIssue({status:'CLOSED'})); app.querySelector('#manage-issue')?.addEventListener('submit',submitManager); app.querySelector('#comment-form')?.addEventListener('submit',submitComment); app.querySelectorAll('[data-reply]').forEach(button=>button.addEventListener('click',()=>showCommentEditor(button.dataset.reply,true))); app.querySelectorAll('[data-edit-comment]').forEach(button=>button.addEventListener('click',()=>showCommentEditor(button.dataset.editComment,false))); app.querySelectorAll('[data-delete-comment]').forEach(button=>button.addEventListener('click',()=>deleteComment(button.dataset.deleteComment))); window.lucide?.createIcons();
    }
    function managerMarkup() { const statuses=['OPEN','IN_PROGRESS','RESOLVED','CLOSED'],priorities=['LOW','MEDIUM','HIGH','CRITICAL']; return `<section class="card"><h3>管理问题</h3><form class="manager" id="manage-issue"><label>状态<select name="status">${statuses.map(item=>`<option value="${item}" ${item===issue.status?'selected':''}>${label(item)}</option>`).join('')}</select></label><label>优先级<select name="priority">${priorities.map(item=>`<option value="${item}" ${item===issue.priority?'selected':''}>${label(item)}</option>`).join('')}</select></label><label>负责人<select name="assignee_id"><option value="">未指派</option><option value="${issue.resource.author_id}" ${issue.assignee?.id===issue.resource.author_id?'selected':''}>资源作者</option></select></label><div class="form-row"><button class="btn primary" type="submit">保存修改</button></div><div class="error"></div></form></section>`; }
    function showIssueEditor() { const host=app.querySelector('#issue-editor'); host.innerHTML=`<form class="editor"><label>标题<input name="title" required minlength="5" maxlength="200" value="${esc(issue.title)}"></label><label>描述<textarea name="description" required maxlength="20000">${esc(issue.description)}</textarea></label><div class="editor-actions"><button class="btn primary" type="submit">保存修改</button><button class="btn" type="button" data-cancel>取消</button></div><div class="error"></div></form>`; host.querySelector('[data-cancel]').onclick=()=>host.innerHTML=''; host.querySelector('form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');OpenResearchCommunity.setBusy(button,true);try{await updateIssue({title:form.elements.title.value,description:form.elements.description.value});}catch(error){host.querySelector('.error').textContent=error.message;}finally{OpenResearchCommunity.setBusy(button,false);}}; }
    function findComment(list, commentId){for(const item of list||[]){if(String(item.id)===String(commentId))return item;const nested=findComment(item.replies,commentId);if(nested)return nested;}return null;}
    function showCommentEditor(commentId,reply){const host=app.querySelector(`[data-comment-editor="${commentId}"]`);if(!host)return;const source=findComment(issue.comments,commentId);host.innerHTML=`<form class="editor"><label>${reply?'回复此评论':'编辑评论'}<textarea name="content" required maxlength="10000">${esc(reply?'':source?.content||'')}</textarea></label><div class="editor-actions"><button class="btn primary" type="submit">${reply?'回复':'保存'}</button><button class="btn" type="button" data-cancel>取消</button></div><div class="error"></div></form>`;host.querySelector('[data-cancel]').onclick=()=>host.innerHTML='';host.querySelector('form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');OpenResearchCommunity.setBusy(button,true);try{const content=form.elements.content.value;await OpenResearchCommunity.jsonRequest(reply?`/api/issues/${id}/comments`:`/api/issue-comments/${commentId}`,{method:reply?'POST':'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(reply?{content,parent_id:Number(commentId)}:{content})});await load();}catch(error){host.querySelector('.error').textContent=error.message;}finally{OpenResearchCommunity.setBusy(button,false);}};}
    async function deleteComment(commentId){if(!confirm('确定要删除这条评论吗？删除后会保留 [已删除] 占位。'))return;try{await OpenResearchCommunity.jsonRequest(`/api/issue-comments/${commentId}`,{method:'DELETE'});await load();}catch(error){alert(error.message);}}
    async function submitComment(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');OpenResearchCommunity.setBusy(button,true);try{await OpenResearchCommunity.jsonRequest(`/api/issues/${id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:form.elements.content.value})});await load();}catch(error){form.querySelector('.error').textContent=error.message;}finally{OpenResearchCommunity.setBusy(button,false);}}
    async function submitManager(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');OpenResearchCommunity.setBusy(button,true);try{await updateIssue({status:form.elements.status.value,priority:form.elements.priority.value,assignee_id:form.elements.assignee_id.value?Number(form.elements.assignee_id.value):null});}catch(error){form.querySelector('.error').textContent=error.message;}finally{OpenResearchCommunity.setBusy(button,false);}}
    async function updateIssue(payload){issue=await OpenResearchCommunity.jsonRequest(`/api/issues/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});render();}
    async function load(){const response=await OpenResearchAuth.request(`/api/issues/${id}`);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'无法加载问题');issue=data;render();}
    async function start(){await OpenResearchAuth.init();OpenResearchAuth.mountNav('[data-auth-nav]');await load();}start().catch(error=>{app.innerHTML=`<section class="card"><h2>无法加载问题</h2><div class="error">${esc(error.message)}</div></section>`;});
  })();
  </script>
</body>
</html>
